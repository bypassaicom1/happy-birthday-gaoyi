<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生日快乐 🎂</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%;
    height:100dvh;                 /* 移动端动态视口，避开地址栏遮挡 */
    overflow:hidden; background:#04020a;
    touch-action:manipulation;     /* 防止双击缩放 */
    -webkit-user-select:none; user-select:none;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  }
  #stage { touch-action:none; }
  #stage { display:block; width:100%; height:100%; }

  .overlay {
    position:fixed; inset:0; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:40px;
  }
  .title {
    font-size:23px; font-weight:700; letter-spacing:6px;
    background:linear-gradient(92deg,#ffd9e8 0%,#ffb3d1 22%,#ffe6a7 48%,#d9b8ff 74%,#a8dcff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,140,190,.75)) drop-shadow(0 0 34px rgba(255,107,157,.45));
    animation:titleBreathe 3.4s ease-in-out infinite;
    margin-bottom:14px;
  }
  @keyframes titleBreathe {
    0%,100% { opacity:.92; transform:scale(1); }
    50%     { opacity:1;   transform:scale(1.035); }
  }
  .subtitle {
    position:relative; height:22px; width:100%; text-align:center;
    font-size:13.5px; letter-spacing:3px; color:rgba(255,225,240,.72);
  }
  .subtitle span {
    position:absolute; left:0; right:0; opacity:0;
    text-shadow:0 0 12px rgba(255,140,190,.6);
    animation:subFade 21s linear infinite;
  }
  .subtitle span:nth-child(1) { animation-delay:0s; }
  .subtitle span:nth-child(2) { animation-delay:3s; }
  .subtitle span:nth-child(3) { animation-delay:6s; }
  .subtitle span:nth-child(4) { animation-delay:9s; }
  .subtitle span:nth-child(5) { animation-delay:12s; }
  .subtitle span:nth-child(6) { animation-delay:15s; }
  .subtitle span:nth-child(7) { animation-delay:18s; }
  @keyframes subFade {
    0%    { opacity:0; transform:translateY(6px); }
    1.4%  { opacity:1; transform:translateY(0); }
    12%   { opacity:1; transform:translateY(0); }
    14.2% { opacity:0; transform:translateY(-6px); }
    100%  { opacity:0; }
  }
  .hint {
    position:fixed; left:50%; bottom:9px; transform:translateX(-50%);
    font-size:11px; letter-spacing:1.5px; color:rgba(255,255,255,.2);
    pointer-events:none; user-select:none;
  }

  /* 音乐控制按钮 */
  /* ===== 开场引导层（不自动播放音乐，引导点击）===== */
  .gate {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(6,3,14,.6);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:opacity .85s ease, visibility .85s;
  }
  .gate.hide { opacity:0; visibility:hidden; pointer-events:none; }
  .gate-icon {
    font-size:62px; margin-bottom:20px;
    animation:gateFloat 3.2s ease-in-out infinite;
    filter:drop-shadow(0 0 22px rgba(255,160,200,.7));
  }
  @keyframes gateFloat {
    0%,100% { transform:translateY(0) scale(1); }
    50%     { transform:translateY(-11px) scale(1.07); }
  }
  .gate-title {
    font-size:29px; font-weight:700; letter-spacing:5px; margin-bottom:12px;
    background:linear-gradient(92deg,#ffd9e8,#ffb3d1 30%,#ffe6a7 62%,#d9b8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,140,190,.6));
  }
  .gate-sub { font-size:14px; letter-spacing:3px; color:rgba(255,225,240,.72); margin-bottom:34px; }
  .gate-btn {
    padding:15px 42px; border-radius:999px; cursor:pointer; font-family:inherit;
    border:1px solid rgba(255,190,220,.5);
    background:linear-gradient(135deg, rgba(255,140,190,.3), rgba(200,130,255,.26));
    color:#fff; font-size:15px; letter-spacing:2px;
    animation:gateGlow 2.6s ease-in-out infinite;
    transition:transform .25s ease;
  }
  .gate-btn:hover { transform:translateY(-2px) scale(1.05); }
  @keyframes gateGlow {
    0%,100% { box-shadow:0 0 26px rgba(255,107,157,.35), inset 0 0 18px rgba(255,180,220,.12); }
    50%     { box-shadow:0 0 44px rgba(255,107,157,.62), inset 0 0 26px rgba(255,180,220,.2); }
  }
  .gate-note { margin-top:18px; font-size:12px; letter-spacing:1.5px; color:rgba(255,255,255,.3); }

  /* ===== 每一步的「点击继续」提示 ===== */
  .hint-next {
    position:fixed; left:50%; bottom:26%; z-index:15;
    transform:translateX(-50%) translateY(12px);
    opacity:0; pointer-events:none;
    display:flex; align-items:center; gap:9px;
    padding:12px 26px; border-radius:999px;
    background:rgba(30,16,40,.52);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(255,190,220,.3);
    color:#ffd6e8; font-size:14.5px; letter-spacing:2px;
    box-shadow:0 0 24px rgba(255,107,157,.22);
    transition:opacity .5s ease, transform .5s ease;
  }
  .hint-next.show {
    opacity:1;
    transform:translateX(-50%) translateY(0);
    animation:hintBob 1.9s ease-in-out infinite;
  }
  @keyframes hintBob {
    0%,100% { transform:translateX(-50%) translateY(0); }
    50%     { transform:translateX(-50%) translateY(-8px); }
  }
  .hint-next .finger { font-size:17px; display:inline-block; animation:fingerTap 1.3s ease-in-out infinite; }
  @keyframes fingerTap {
    0%,100% { transform:translateY(0) scale(1); }
    50%     { transform:translateY(-4px) scale(1.12); }
  }

  /* ===== 许愿时刻（点蛋糕后、爆炸前）===== */
  .wish-moment {
    position:fixed; inset:0; z-index:18;
    display:none;                    /* 由 JS 控制显示，隐藏时彻底不渲染 */
    flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; opacity:0;
    transition:opacity .7s ease;
  }
  .wish-moment.show { opacity:1; }
  .wish-moment .wish-icon {
    font-size:54px; margin-bottom:20px;
    animation:wishCandle 2.3s ease-in-out infinite;
    filter:drop-shadow(0 0 28px rgba(255,200,120,.9));
  }
  @keyframes wishCandle {
    0%,100% { transform:scale(1) translateY(0); opacity:.9; }
    50%     { transform:scale(1.14) translateY(-7px); opacity:1; }
  }
  .wish-moment .wish-text {
    font-size:23px; letter-spacing:6px; color:#ffe9c4;
    text-shadow:0 0 22px rgba(255,190,120,.95), 0 0 48px rgba(255,150,80,.65);
    animation:wishPulse 2.3s ease-in-out infinite;
  }
  @keyframes wishPulse {
    0%,100% { opacity:.86; transform:scale(1); }
    50%     { opacity:1;   transform:scale(1.03); }
  }

  /* ===== 爆炸后浮现的愿望卡片 ===== */
  .wish-card {
    position:fixed; left:50%; top:50%; z-index:19;
    display:none;                    /* 由 JS 控制显示 */
    transform:translate(-50%, -50%) scale(.88);
    opacity:0; pointer-events:none; text-align:center;
    padding:26px 40px; border-radius:22px;
    background:rgba(28,14,38,.64);
    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);
    border:1px solid rgba(255,200,160,.4);
    box-shadow:0 0 48px rgba(255,150,90,.36), inset 0 0 32px rgba(255,180,120,.1);
    transition:opacity .85s ease, transform .85s cubic-bezier(.2,.9,.3,1.25);
  }
  .wish-card.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
  .wish-card.swap { animation:cardSwap .62s ease; }
  @keyframes cardSwap {
    0%   { transform:translate(-50%, -50%) scale(1); }
    42%  { transform:translate(-50%, -50%) scale(.93); opacity:.72; }
    100% { transform:translate(-50%, -50%) scale(1); opacity:1; }
  }
  .wish-card .card-icon { font-size:40px; margin-bottom:14px; }
  .wish-card .card-title {
    font-size:14.5px; letter-spacing:3px; color:rgba(255,228,205,.82); margin-bottom:12px;
  }
  .wish-card .card-text {
    font-size:23px; font-weight:700; letter-spacing:3px; line-height:1.5;
    background:linear-gradient(92deg,#ffd9a8,#ffe9c4 38%,#ffc4d6 74%,#ffd9a8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,180,120,.8));
  }

  /* ===== 愿望卡片之后的「好奇追问」打字机动画 ===== */
  .wonder-text {
    position:fixed; left:50%; top:50%; z-index:19;
    display:none;                    /* 由 JS 控制显示 */
    transform:translate(-50%, -50%);
    opacity:0; pointer-events:none; text-align:center;
    max-width:88vw;
    transition:opacity .8s ease;
  }
  .wonder-text.show { opacity:1; }
  .wonder-text .wonder-icon {
    font-size:34px; margin-bottom:16px; display:inline-block;
    animation:wonderFloat 2.7s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(200,160,255,.8));
  }
  @keyframes wonderFloat {
    0%,100% { transform:translateY(0) rotate(-7deg) scale(1); opacity:.85; }
    50%     { transform:translateY(-10px) rotate(9deg) scale(1.1); opacity:1; }
  }
  .wonder-text .wonder-line {
    font-size:20px; letter-spacing:2.5px; line-height:1.85;
    color:#eadcff; font-weight:600;
    white-space:pre-line;              /* 保留文案里的换行 */
    text-shadow:0 0 20px rgba(200,160,255,.9), 0 0 46px rgba(160,120,255,.6);
  }
  .wonder-text .cursor {
    display:inline-block; width:2px; height:1em; vertical-align:-0.13em;
    background:#d9b8ff; margin-left:4px;
    box-shadow:0 0 10px rgba(200,160,255,.9);
    animation:cursorBlink .85s step-end infinite;
  }
  @keyframes cursorBlink { 50% { opacity:0; } }
  .wonder-text.done .wonder-line { animation:wonderBreath 3s ease-in-out infinite; }
  @keyframes wonderBreath {
    0%,100% { opacity:.9; transform:scale(1); }
    50%     { opacity:1;  transform:scale(1.02); }
  }
  /* 追问文字周围飘散的星光 */
  .wonder-text .spark {
    position:absolute; font-size:14px; opacity:0;
    animation:sparkFly 2.6s ease-out infinite;
  }
  .wonder-text .spark.s1 { left:-8%;  top:10%; animation-delay:0s; }
  .wonder-text .spark.s2 { right:-6%; top:30%; animation-delay:.9s; }
  .wonder-text .spark.s3 { left:12%;  bottom:-4%; animation-delay:1.7s; }
  @keyframes sparkFly {
    0%   { opacity:0; transform:translateY(6px) scale(.6); }
    30%  { opacity:1; transform:translateY(-4px) scale(1.1); }
    100% { opacity:0; transform:translateY(-22px) scale(.7); }
  }

  .music-btn {
    position:fixed; right:22px; bottom:22px; z-index:20;
    width:52px; height:52px; border-radius:50%;
    border:1px solid rgba(255,190,220,.35);
    background:rgba(30,16,40,.55);
    backdrop-filter:blur(10px);
    color:#ffd6e8; font-size:21px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 22px rgba(255,107,157,.28), inset 0 0 14px rgba(255,140,190,.12);
    transition:all .25s ease;
    animation:btnPulse 2.8s ease-in-out infinite;
  }
  .music-btn:hover {
    transform:scale(1.1);
    border-color:rgba(255,190,220,.75);
    box-shadow:0 0 34px rgba(255,107,157,.55);
  }
  .music-btn.playing {
    border-color:rgba(255,214,168,.6);
    box-shadow:0 0 30px rgba(255,205,130,.5);
  }
  .music-btn .ring {
    position:absolute; inset:-6px; border-radius:50%;
    border:1px solid rgba(255,140,190,.35);
    opacity:0;
  }
  .music-btn.playing .ring {
    animation:ripple 1.9s ease-out infinite;
  }
  @keyframes ripple {
    0%   { transform:scale(.85); opacity:.7; }
    100% { transform:scale(1.5);  opacity:0; }
  }
  @keyframes btnPulse {
    0%,100% { box-shadow:0 0 20px rgba(255,107,157,.25), inset 0 0 12px rgba(255,140,190,.1); }
    50%     { box-shadow:0 0 32px rgba(255,107,157,.45), inset 0 0 18px rgba(255,140,190,.18); }
  }

  .vignette {
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.75) 100%);
  }

  /* ===== 手机 / 竖屏适配 ===== */
  @media (max-width: 640px), (orientation: portrait) and (max-width: 900px) {
    .gate-icon { font-size:48px; margin-bottom:16px; }
    .gate-title { font-size:21px; letter-spacing:3px; margin-bottom:10px; }
    .gate-sub { font-size:12.5px; letter-spacing:2px; margin-bottom:26px; }
    .gate-btn { padding:13px 28px; font-size:14px; letter-spacing:1.5px; }
    .gate-note { font-size:11px; margin-top:14px; }

    .overlay { padding-bottom:24px; }
    .title { font-size:16px; letter-spacing:3px; margin-bottom:10px; }
    .subtitle { font-size:11.5px; letter-spacing:1.5px; height:18px; }

    .hint-next {
      bottom:28%; font-size:13px; letter-spacing:1.5px;
      padding:10px 20px; gap:7px;
    }
    .hint-next .finger { font-size:15px; }

    .wish-moment .wish-icon { font-size:40px; margin-bottom:14px; }
    .wish-moment .wish-text { font-size:17px; letter-spacing:4px; }
    .wish-card { padding:20px 26px; border-radius:18px; width:auto; max-width:86vw; }
    .wish-card .card-icon { font-size:32px; margin-bottom:10px; }
    .wish-card .card-title { font-size:12.5px; letter-spacing:2px; margin-bottom:9px; }
    .wish-card .card-text { font-size:18px; letter-spacing:2px; }
    .wonder-text .wonder-icon { font-size:26px; margin-bottom:12px; }
    .wonder-text .wonder-line { font-size:15.5px; letter-spacing:1.5px; line-height:1.8; }

    .music-btn { width:44px; height:44px; font-size:18px; right:14px; bottom:14px; }
    .hint { font-size:9.5px; letter-spacing:1px; bottom:6px; }
  }

  /* 超小屏（窄手机） */
  @media (max-width: 380px) {
    .gate-title { font-size:18px; letter-spacing:2px; }
    .title { font-size:14px; letter-spacing:2px; }
    .subtitle { font-size:10.5px; }
    .hint-next { font-size:12px; padding:9px 16px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- 背景音乐（与 index.html 同目录的 333.mp3） -->
<audio id="bgm" src="333.mp3" loop preload="auto" playsinline webkit-playsinline></audio>

<!-- 开场引导层：点击后才播放音乐 -->
<div class="gate" id="gate">
  <div class="gate-icon">🎂</div>
  <div class="gate-title" id="gateTitle">高怡，生日快乐</div>
  <div class="gate-sub" id="gateSub">有一份小心意，等你开启 ✨</div>
  <button class="gate-btn" id="gateBtn">🎵 点击开启（含背景音乐）</button>
</div>

<!-- 每一步的点击引导提示 -->
<div class="hint-next" id="hintNext">
  <span class="finger" id="hintIcon">👆</span>
  <span id="hintText">点击继续</span>
</div>

<!-- 许愿时刻：点击蛋糕后、爆炸前 -->
<div class="wish-moment" id="wishMoment">
  <div class="wish-icon">🕯️</div>
  <div class="wish-text" id="wishMomentText">闭上眼睛，许个愿吧</div>
</div>

<!-- 爆炸后浮现的愿望卡片 -->
<div class="wish-card" id="wishCard">
  <div class="card-icon" id="wishCardIcon">🎓</div>
  <div class="card-title" id="wishCardTitle">我也为你许了一个愿望</div>
  <div class="card-text" id="wishCardText">祝你考研一定上岸！</div>
</div>

<!-- 愿望卡片之后：好奇追问（打字机动画）-->
<div class="wonder-text" id="wonderText">
  <div class="wonder-icon">💭</div>
  <div class="wonder-line"><span id="wonderLine"></span><span class="cursor" id="wonderCursor"></span></div>
  <span class="spark s1">✨</span>
  <span class="spark s2">✨</span>
  <span class="spark s3">✨</span>
</div>
<div class="vignette"></div>

<div class="overlay">
  <div class="title" id="title">🎂 生日快乐 🎂</div>
  <div class="subtitle" id="subtitle"></div>
</div>

<button class="music-btn" id="musicBtn" title="背景音乐开关">
  <span class="ring"></span>
  <span id="musicIcon">🔈</span>
</button>

<div class="hint">点击继续 · 右下角可开关音乐</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ⚙️  可自定义区域
   ══════════════════════════════════════════════════════════════ */
const TITLE_TEXT = '🎂 高怡 · 生日快乐 🎂';        // 底部大标题
const GATE_TITLE = '高怡，生日快乐';              // 引导层标题
const GATE_SUB = '有几句话，想说给你听';           // 引导层副标题

// —— 许愿环节文案（可自定义）——
const WISH_HINT = '闭上眼睛，许个愿吧';           // 点蛋糕后浮现的许愿提示
const WISH_CARD_TITLE = '我也为你许了一个愿望';    // 爆炸后卡片小标题
const WISH_CARD_TEXT = '祝你考研一定上岸！';       // 爆炸后卡片正文
const CHEER_TEXT = '恭喜你的愿望一定会成功实现';    // 爆炸后的第一句话
const WISH_SECONDS = 2800;                       // 许愿停留时长（毫秒）
const WONDER_TEXT =
  '不知道你偷偷许了什么愿望呢？\n\n' +
  '很高兴认识你。\n' +
  '认识你之后，我也开心了很多。';                 // 逐字打出
const WONDER_SPEED = 115;                        // 打字速度（毫秒/字）
const SUBTITLES = [                                // 轮播文案（真诚，不堆砌）
  '很高兴认识你',
  '认识你之后，我也开心了很多',
  '生日快乐，高怡',
  '祝你考研一定上岸',
  '希望你以后轻松一点，也快乐一点',
];

// 粒子形态循环（text 可多行；heart / cake / star 为图形）
const SHAPES = [
  { kind: 'text',  lines: ['高怡'],                hint: '点击继续',              icon: '👆' },
  { kind: 'text',  lines: ['生日快乐'],             hint: '点击继续',              icon: '👆' },
  { kind: 'heart', lines: ['生日快乐'],             hint: '点击继续',              icon: '👆' },
  { kind: 'text',  lines: ['高怡', '生日快乐'],      hint: '点击继续',              icon: '👆' },
  { kind: 'cake', lines: ['生日快乐'],              hint: '点击蛋糕，闭上眼睛许个愿吧', icon: '🎂', action: 'blast' },
  { kind: 'text',  lines: ['HAPPY', 'BIRTHDAY'],   hint: '点击继续',              icon: '👆' },
  { kind: 'star',                                  hint: '点击继续',              icon: '👆' },
  { kind: 'text',  lines: ['永远开心'],             hint: '点击继续',              icon: '👆' },
];
const SHAPE_DURATION = 4800;   // 每个形态停留时长（毫秒）

/* ══════════════════════════════════════════════════════════════
   环境
   ══════════════════════════════════════════════════════════════ */
const TITLE_EL = document.getElementById('title');
const SUB_EL = document.getElementById('subtitle');
TITLE_EL.textContent = TITLE_TEXT;
SUBTITLES.forEach((s) => {
  const el = document.createElement('span');
  el.textContent = s;
  SUB_EL.appendChild(el);
});
// 让轮播时长与条数匹配
SUB_EL.querySelectorAll('span').forEach((el, i) => {
  el.style.animationDelay = (i * 3) + 's';
});
SUB_EL.querySelectorAll('span').forEach((el) => {
  el.style.animationDuration = (SUBTITLES.length * 3) + 's';
});

/* ── 设备与画质分级（手机/平板自动降级，保证流畅）── */
const IS_MOBILE =
  /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|HarmonyOS/i.test(navigator.userAgent) ||
  (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
  Math.min(window.innerWidth, window.innerHeight) < 600;

const QUALITY = IS_MOBILE
  ? {
      maxParticles: 3000,   // 手机粒子数（桌面 6200）
      dprCap: 1.3,          // 限制渲染分辨率，省 GPU
      bloom: false,         // 手机不做泛光后处理（最耗性能的一步）
      starsDivisor: 15000,  // 星星更稀疏
      grainGap: 1.35,       // 采样间隔放大 → 粒子更少
      fxScale: 0.55,        // 烟花粒子数减半
      fireworkEvery: 4200,  // 自动烟花间隔更长
      nebulaHalf: true,     // 星云半分辨率
    }
  : {
      maxParticles: 6200,
      dprCap: 2,
      bloom: true,
      starsDivisor: 7000,
      grainGap: 1,
      fxScale: 1,
      fireworkEvery: 2300,
      nebulaHalf: true,
    };

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d', { alpha: false });

const scene = document.createElement('canvas');
const sctx = scene.getContext('2d');

const bloomC = document.createElement('canvas');
const bctx = bloomC.getContext('2d');

const nebC = document.createElement('canvas');
const nctx = nebC.getContext('2d');

const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

let W = 0, H = 0, dpr = 1, BW = 0, BH = 0;

function measureViewport() {
  // 用 canvas 的实际渲染尺寸，避免移动端地址栏伸缩造成画面拉伸
  const rect = stage.getBoundingClientRect();
  return {
    w: Math.max(1, Math.round(rect.width || window.innerWidth)),
    h: Math.max(1, Math.round(rect.height || window.innerHeight)),
  };
}

function applySize(nw, nh) {
  dpr = Math.min(window.devicePixelRatio || 1, QUALITY.dprCap);
  W = nw;
  H = nh;
  stage.width = Math.floor(W * dpr);
  stage.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scene.width = Math.floor(W * dpr);
  scene.height = Math.floor(H * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  BW = Math.max(2, Math.floor(W / 4));
  BH = Math.max(2, Math.floor(H / 4));
  bloomC.width = BW;
  bloomC.height = BH;

  ctx.fillStyle = '#04020a';
  ctx.fillRect(0, 0, W, H);
  sctx.fillStyle = '#04020a';
  sctx.fillRect(0, 0, W, H);
}

function resize() {
  const v = measureViewport();
  applySize(v.w, v.h);
}

// 尺寸小幅变化（手机地址栏伸缩/轻微旋转）：只做等比缩放，
// 保持文字形状稳定，不重新采样、不让粒子重飞一遍
function softResize(nw, nh) {
  if (!W || !H) { applySize(nw, nh); return; }
  const sx = nw / W;
  const sy = nh / H;
  applySize(nw, nh);
  for (const pt of particles) {
    pt.x *= sx; pt.y *= sy;
    pt.tx *= sx; pt.ty *= sy;
  }
  for (const f of fw) { f.x *= sx; f.y *= sy; }
  for (const f of flames) { f.x *= sx; f.y *= sy; }
  buildStars();
  buildNebula();
}

/* ══════════════════════════════════════════════════════════════
   高级调色板 + 发光贴图
   ══════════════════════════════════════════════════════════════ */
const PALETTE = [
  [255, 236, 244],   // 珍珠白
  [255, 190, 214],   // 樱粉
  [255, 133, 175],   // 玫红
  [255, 205, 130],   // 香槟金
  [255, 240, 190],   // 浅金
  [214, 168, 255],   // 淡紫
  [166, 143, 255],   // 紫罗兰
  [163, 224, 255],   // 冰蓝
  [255, 255, 255],   // 纯白
];
const PURE_WHITE = 8;

function makeSprite([r, g, b], core = 0.2) {
  const size = 30;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g2 = c.getContext('2d');
  const grad = g2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.12, `rgba(${r},${g},${b},0.8)`);
  grad.addColorStop(0.3, `rgba(${r},${g},${b},0.18)`);
  grad.addColorStop(0.58, `rgba(${r},${g},${b},0.04)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  g2.fillStyle = grad;
  g2.fillRect(0, 0, size, size);
  return c;
}
const SPRITES = PALETTE.map((c) => makeSprite(c));
const SPRITE_SIZE = 30;

function glow(sprite, x, y, scale, alpha) {
  if (alpha <= 0.004) return;
  const s = SPRITE_SIZE * scale;
  sctx.globalAlpha = alpha > 1 ? 1 : alpha;
  sctx.drawImage(sprite, x - s / 2, y - s / 2, s, s);
  sctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   形态采样（统一：先画到离屏画布，再像素采样成点集）
   ══════════════════════════════════════════════════════════════ */
function fontStr(fs) {
  return `700 ${fs}px "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif`;
}

function drawHeart(g, cx, cy, size, lineWidth) {
  const s = size / 17;
  g.beginPath();
  for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.04) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const px = cx + x * s;
    const py = cy - y * s;
    if (t === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
  if (lineWidth) {
    // 描边模式：粒子勾勒爱心轮廓，中间留白写文字
    g.lineWidth = lineWidth;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.stroke();
  } else {
    g.fill();
  }
}

function drawStar(g, cx, cy, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.42;
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const px = cx + Math.cos(a) * rad;
    const py = cy + Math.sin(a) * rad;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
  g.fill();
}

function drawCake(g, cx, cy, size) {
  const w = size, h = size * 0.8;
  const x0 = cx - w / 2, y0 = cy - h / 2 + h * 0.1;
  // 盘子
  g.beginPath();
  g.ellipse(cx, y0 + h * 0.98, w * 0.56, h * 0.075, 0, 0, Math.PI * 2);
  g.fill();
  // 三层蛋糕
  g.fillRect(x0 + w * 0.03, y0 + h * 0.6, w * 0.94, h * 0.34);
  g.fillRect(x0 + w * 0.13, y0 + h * 0.32, w * 0.74, h * 0.28);
  g.fillRect(x0 + w * 0.24, y0 + h * 0.08, w * 0.52, h * 0.24);
  // 蜡烛
  g.fillRect(cx - w * 0.022, y0 - h * 0.16, w * 0.044, h * 0.25);
  // 烛焰
  g.beginPath();
  g.ellipse(cx, y0 - h * 0.21, w * 0.05, h * 0.075, 0, 0, Math.PI * 2);
  g.fill();
}

function sampleShape(shape) {
  off.width = W;
  off.height = H;
  octx.clearRect(0, 0, W, H);
  octx.fillStyle = '#fff';
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';

  let gap = 5;

  if (shape.kind === 'text') {
    const lines = shape.lines;
    let fs = Math.min(H * 0.26, W * 0.4);
    const maxW = W * 0.84;
    for (const ln of lines) {
      octx.font = fontStr(fs);
      const w = octx.measureText(ln).width;
      if (w > maxW) fs *= maxW / w;
    }
    if (lines.length > 1) fs = Math.min(fs, (H * 0.5) / lines.length / 1.2);
    const lh = fs * 1.18;
    const startY = shapeCenterY() - ((lines.length - 1) * lh) / 2;
    octx.font = fontStr(fs);
    lines.forEach((ln, i) => octx.fillText(ln, W / 2, startY + i * lh));
    gap = Math.max(3, Math.round((fs / 36) * QUALITY.grainGap));
  } else if (shape.kind === 'heart') {
    const size = Math.min(W * 0.62, H * 0.62);
    const cy = shapeCenterY();
    octx.strokeStyle = '#fff';
    // 爱心轮廓
    drawHeart(octx, W / 2, cy, size, Math.max(7, size * 0.048));
    // 爱心内部文字
    if (shape.lines && shape.lines.length) {
      const fs = Math.min(size * 0.165, W * 0.17);
      octx.font = fontStr(fs);
      octx.fillText(shape.lines[0], W / 2, cy + size * 0.015);
    }
    gap = Math.max(3, Math.round((size / 150) * QUALITY.grainGap));
  } else if (shape.kind === 'star') {
    const r = Math.min(W * 0.34, H * 0.34);
    drawStar(octx, W / 2, shapeCenterY(), r);
    gap = Math.max(3, Math.round((r / 78) * QUALITY.grainGap));
  } else if (shape.kind === 'cake') {
    const size = Math.min(W * 0.58, H * 0.56);
    const ccy = shapeCenterY() * 1.02;
    drawCake(octx, W / 2, ccy, size);
    // 在蛋糕体上"刻"出文字（挖空 → 负空间呈现文字）
    if (shape.lines && shape.lines.length) {
      const fs = Math.min(size * 0.125, W * 0.12);
      octx.save();
      octx.globalCompositeOperation = 'destination-out';
      octx.font = fontStr(fs);
      octx.fillText(shape.lines[0], W / 2, ccy + size * 0.05);
      octx.restore();
      octx.globalCompositeOperation = 'source-over';
    }
    gap = Math.max(3, Math.round((size / 145) * QUALITY.grainGap));
  }

  const img = octx.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y += gap) {
    const row = y * W;
    for (let x = 0; x < W; x += gap) {
      if (img[(row + x) * 4 + 3] > 128) pts.push({ x, y });
    }
  }
  return pts;
}

/* ══════════════════════════════════════════════════════════════
   粒子
   ══════════════════════════════════════════════════════════════ */
const MAX_PARTICLES = QUALITY.maxParticles;

// 动态降级：帧率过低时自动减粒子、关泛光
let bloomEnabled = QUALITY.bloom;
let degraded = false;
let lastFrameT = 0;
let fpsAcc = 0;
let fpsCount = 0;

class Particle {
  constructor() {
    this.reset(true);
  }
  reset(scatter) {
    const cx = W / 2, cy = H * 0.44;
    if (scatter) {
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * Math.min(W, H) * 0.62;
      this.x = cx + Math.cos(a) * d;
      this.y = cy + Math.sin(a) * d;
    } else {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
    }
    this.tx = this.x;
    this.ty = this.y;
    this.vx = 0;
    this.vy = 0;
    this.z = 0.62 + Math.random() * 0.78;          // 深度
    const CW = [0, 0, 0, 1, 1, 2, 3, 3, 3, 4, 4, 5, 6, 7, 8, 8];
    this.ci = CW[(Math.random() * CW.length) | 0];
    this.sprite = SPRITES[this.ci];
    this.baseScale = (0.14 + Math.random() * 0.18) * this.z * (IS_MOBILE ? 1.32 : 1);
    this.phase = Math.random() * Math.PI * 2;
    this.twinkle = 0.6 + Math.random() * 0.9;
    this.alpha = 1;
    this.stiff = 0.0095 + Math.random() * 0.006;   // 个性刚度
  }
  retarget(tx, ty, explode) {
    this.tx = tx;
    this.ty = ty;
    if (explode) {
      const a = Math.random() * Math.PI * 2;
      const sp = (2 + Math.random() * 8) * this.z;
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp;
    }
  }
  update(t, mx, my, swirl) {
    // 弹性趋近目标
    this.vx = (this.vx + (this.tx - this.x) * this.stiff) * 0.905;
    this.vy = (this.vy + (this.ty - this.y) * this.stiff) * 0.905;

    // 流场涡旋（有机漂浮感）
    if (swirl) {
      const ang =
        Math.sin(this.x * 0.0052 + t * 0.00022) * 2.1 +
        Math.cos(this.y * 0.0061 - t * 0.00017) * 2.1;
      this.vx += Math.cos(ang) * swirl;
      this.vy += Math.sin(ang) * swirl;
    }

    // 鼠标斥力（手机上触摸会持续推开粒子、导致文字看起来"移动变形"，故手机禁用）
    if (!IS_MOBILE) {
      const mdx = this.x - mx;
      const mdy = this.y - my;
      const d2 = mdx * mdx + mdy * mdy;
      const R = 145;
      if (d2 < R * R) {
        const d = Math.sqrt(d2) || 0.001;
        const f = (1 - d / R) * 2.6 * this.z;
        this.vx += (mdx / d) * f;
        this.vy += (mdy / d) * f;
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    this.alpha = 0.84 + 0.16 * Math.sin(t * 0.0015 * this.twinkle + this.phase);
  }
  draw(t) {
    const wobAmp = IS_MOBILE ? 0.32 : 0.7;
    const wob = Math.sin(t * 0.0009 + this.phase) * wobAmp * this.z;
    const wob2 = Math.cos(t * 0.0011 + this.phase * 1.4) * wobAmp * this.z;
    glow(this.sprite, this.x + wob, this.y + wob2, this.baseScale, this.alpha);
  }
}

let particles = [];
let shapeIndex = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function morphTo(index, explode) {
  const pts = shuffle(sampleShape(SHAPES[index]));
  if (!pts.length) return;
  // 限制数量
  let targets = pts;
  if (pts.length > MAX_PARTICLES) {
    targets = pts.slice(0, MAX_PARTICLES);
  }
  // 粒子数不足则补
  while (particles.length < targets.length) particles.push(new Particle());
  // 粒子数过多：飞散（视觉上自然消散）
  if (particles.length > targets.length) {
    const drop = particles.slice(targets.length);
    for (const p of drop) {
      const a = Math.random() * Math.PI * 2;
      p.retarget(W / 2 + Math.cos(a) * W * 1.4, H / 2 + Math.sin(a) * H * 1.4, true);
      p.alpha = 0;
    }
    particles.length = targets.length;
  }
  for (let i = 0; i < particles.length; i++) {
    particles[i].retarget(targets[i].x, targets[i].y, explode);
  }
}

/* ══════════════════════════════════════════════════════════════
   🎂 生日蛋糕：烛火摇曳 + 炸开特效
   ══════════════════════════════════════════════════════════════ */
let blasted = false;   // 本次蛋糕形态是否已炸开
let flash = 0;         // 全屏闪光强度

// 蛋糕几何（与 drawCake 保持一致）
function shapeCenterY() {
  // 竖屏时文字上移一点，给底部标题/按钮留空间
  return W > H ? H * 0.45 : H * 0.38;
}

function cakeGeom() {
  const size = Math.min(W * 0.56, H * 0.54);
  const cy = shapeCenterY() * 1.02;
  const h = size * 0.8;
  const y0 = cy - h / 2 + h * 0.1;
  return { cx: W / 2, cy, size, h, y0, flameX: W / 2, flameY: y0 - h * 0.21 };
}

// ---- 烛火粒子 ----
const flames = [];
function spawnFlame(g) {
  flames.push({
    x: g.flameX + (Math.random() - 0.5) * 5,
    y: g.flameY + (Math.random() - 0.5) * 4,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -0.45 - Math.random() * 0.8,
    life: 1,
    decay: 0.021 + Math.random() * 0.021,
    scale: 0.26 + Math.random() * 0.32,
    sprite: Math.random() < 0.55 ? SPRITES[3] : SPRITES[4],
    phase: Math.random() * Math.PI * 2,
  });
}

function updateFlames() {
  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];
    f.x += f.vx + Math.sin(f.y * 0.06 + f.phase) * 0.24;
    f.y += f.vy;
    f.vy *= 0.984;
    f.life -= f.decay;
    if (f.life <= 0) { flames.splice(i, 1); continue; }
    glow(f.sprite, f.x, f.y, f.scale * (0.4 + f.life * 0.9), f.life * 0.95);
  }
}

// ---- 炸开音效（Web Audio 合成的低频轰鸣） ----
function playBlast() {
  if (!ensureAudioEngine()) return;
  try {
    const dur = 1.35;
    const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.4);
    }
    const src = actx.createBufferSource();
    src.buffer = buf;
    const filt = actx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(2400, actx.currentTime);
    filt.frequency.exponentialRampToValueAtTime(150, actx.currentTime + 0.95);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.5, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    src.connect(filt);
    filt.connect(g);
    g.connect(actx.destination);
    src.start();
  } catch (e) { /* 忽略音频异常 */ }
}

// ---- 炸开！ ----
function cakeBlast() {
  const g = cakeGeom();

  // 1. 所有粒子从蛋糕中心向外爆散
  for (const pt of particles) {
    const a = Math.atan2(pt.y - g.cy, pt.x - g.cx) + (Math.random() - 0.5) * 0.85;
    const sp = 7 + Math.random() * 13;
    pt.vx = Math.cos(a) * sp;
    pt.vy = Math.sin(a) * sp;
    pt.retarget(g.cx + Math.cos(a) * W * 0.85, g.cy + Math.sin(a) * H * 0.85, false);
  }

  // 2. 金色礼花五连发
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      burst(
        g.cx + (Math.random() - 0.5) * W * 0.55,
        g.cy + (Math.random() - 0.5) * H * 0.45,
        { type: Math.random() < 0.5 ? 'chrys' : 'peony', scale: 1.05 + Math.random() * 0.6 }
      );
    }, i * 130);
  }

  // 3. 全屏闪光 + 轰鸣
  flash = 1;
  playBlast();
}

/* ══════════════════════════════════════════════════════════════
   烟花系统（6 种类型）
   ══════════════════════════════════════════════════════════════ */
const fw = [];
const FW_TYPES = ['peony', 'ring', 'heart', 'willow', 'chrys', 'double'];

function pickColorIdx() {
  return (Math.random() * (PALETTE.length - 1)) | 0;
}

function burst(x, y, options = {}) {
  const type = options.type || FW_TYPES[(Math.random() * FW_TYPES.length) | 0];
  const scale = options.scale || 1;
  const push = (p) => fw.push(p);
  const mk = (vx, vy, ci, decay, scaleP, w) => ({
    x, y, vx, vy, life: 1,
    decay: decay || 0.011,
    sprite: SPRITES[ci],
    scale: (scaleP || 1) * scale,
    g: w === undefined ? 0.045 : w,
  });

  const c1 = pickColorIdx();
  let c2 = pickColorIdx();
  if (c2 === c1) c2 = PURE_WHITE;
  const FS = QUALITY.fxScale;   // 粒子数缩放（手机减半）

  if (type === 'peony') {
    const n = Math.round(130 * FS);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (1.1 + Math.random() * 4.6) * scale;
      push(mk(Math.cos(a) * sp, Math.sin(a) * sp, Math.random() < 0.3 ? PURE_WHITE : c1, 0.008 + Math.random() * 0.012, 0.5 + Math.random() * 0.5));
    }
  } else if (type === 'ring') {
    const n = Math.round(110 * FS);
    const r = (2.9 + Math.random() * 0.7) * scale;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      push(mk(Math.cos(a) * r, Math.sin(a) * r, c1, 0.0072, 0.62, 0.02));
    }
  } else if (type === 'heart') {
    const n = Math.round(120 * FS);
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const k = 0.185 * scale;
      push(mk(hx * k, -hy * k, Math.random() < 0.35 ? c2 : c1, 0.0068, 0.68, 0.018));
    }
  } else if (type === 'willow') {
    const n = Math.round(95 * FS);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (0.6 + Math.random() * 2.1) * scale;
      push(mk(Math.cos(a) * sp, Math.sin(a) * sp - 0.6, c1, 0.0035, 0.72, 0.085));
    }
  } else if (type === 'chrys') {
    const n = Math.round(150 * FS);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (2.2 + Math.random() * 3.4) * scale;
      const jitter = 0.45;
      push(mk(
        Math.cos(a) * sp + (Math.random() - 0.5) * jitter,
        Math.sin(a) * sp + (Math.random() - 0.5) * jitter,
        Math.random() < 0.22 ? PURE_WHITE : (Math.random() < 0.5 ? c1 : c2),
        0.009 + Math.random() * 0.01,
        0.5 + Math.random() * 0.55
      ));
    }
  } else { // double：双色同心环
    const n = Math.round(72 * FS);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      push(mk(Math.cos(a) * 1.7 * scale, Math.sin(a) * 1.7 * scale, c1, 0.0066, 0.66, 0.015));
      push(mk(Math.cos(a + 0.09) * 3.6 * scale, Math.sin(a + 0.09) * 3.6 * scale, c2, 0.0076, 0.56, 0.015));
    }
  }

  // 中心闪光
  for (let i = 0; i < Math.round(14 * FS); i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 1.1;
    push(mk(Math.cos(a) * sp, Math.sin(a) * sp, PURE_WHITE, 0.05, 1.5, 0.02));
  }
}

function updateFireworks() {
  for (let i = fw.length - 1; i >= 0; i--) {
    const p = fw[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;
    p.vx *= 0.9865;
    p.vy *= 0.9865;
    p.life -= p.decay;
    if (p.life <= 0) { fw.splice(i, 1); continue; }
    const fade = p.life * p.life;
    glow(p.sprite, p.x, p.y, p.scale * (0.35 + p.life * 0.9), fade);
  }
}

function volley() {
  const n = 1 + ((Math.random() * 3) | 0);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      burst(W * (0.1 + Math.random() * 0.8), H * (0.08 + Math.random() * 0.46), { scale: 0.85 + Math.random() * 0.5 });
    }, i * 190);
  }
}

/* ══════════════════════════════════════════════════════════════
   星云 & 星空
   ══════════════════════════════════════════════════════════════ */
function buildNebula() {
  nebC.width = Math.max(2, Math.floor(W / 2));
  nebC.height = Math.max(2, Math.floor(H / 2));
  const g = nctx;
  g.clearRect(0, 0, nebC.width, nebC.height);
  g.globalCompositeOperation = 'lighter';
  const blobs = [
    { x: 0.24, y: 0.26, r: 0.52, c: [128, 44, 168], a: 0.13 },
    { x: 0.78, y: 0.2,  r: 0.46, c: [206, 58, 126], a: 0.11 },
    { x: 0.52, y: 0.74, r: 0.6,  c: [44, 70, 168],  a: 0.1 },
    { x: 0.12, y: 0.84, r: 0.42, c: [176, 96, 48],  a: 0.07 },
    { x: 0.9,  y: 0.68, r: 0.4,  c: [96, 60, 180],  a: 0.08 },
  ];
  for (const b of blobs) {
    const rad = Math.max(nebC.width, nebC.height) * b.r;
    const cx = b.x * nebC.width, cy = b.y * nebC.height;
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    grad.addColorStop(0, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a})`);
    grad.addColorStop(0.45, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a * 0.34})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, nebC.width, nebC.height);
  }
}

let stars = [];
function buildStars() {
  stars = [];
  const n = Math.round((W * H) / QUALITY.starsDivisor);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: 0.3 + Math.random() * 1.2,
      t: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 0.9,
      ci: Math.random() < 0.78 ? PURE_WHITE : (Math.random() * 7) | 0,
    });
  }
}

function drawStars(t, px, py) {
  for (const s of stars) {
    const a = 0.16 + 0.34 * (0.5 + 0.5 * Math.sin(t * 0.0008 * s.sp + s.t));
    glow(
      SPRITES[s.ci],
      s.x + px * s.z * 0.02,
      s.y + py * s.z * 0.02,
      0.16 + s.z * 0.16,
      a
    );
  }
}

/* ══════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════ */
const mouse = { x: -9999, y: -9999, px: 0, py: 0 };

window.addEventListener('mousemove', (e) => {
  mouse.px = (e.clientX - W / 2) / W;
  mouse.py = (e.clientY - H / 2) / H;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

let entered = false;   // 是否已点击进入（引导层关闭）

function fireAt(x, y) {
  burst(x, y, { scale: 0.95 + Math.random() * 0.45 });
  setTimeout(() => burst(x + (Math.random() - 0.5) * 90, y + (Math.random() - 0.5) * 90, { scale: 0.62 }), 130);
}
let lastTapAt = 0;

function handleTap(x, y) {
  // 手机上一次触摸会同时触发 touchstart 与 mousedown，去重避免重复推进
  const now = performance.now();
  if (now - lastTapAt < 320) return;
  lastTapAt = now;

  if (!entered) return;
  // 剧情推进阶段：点击 = 继续（未稳定时点击无效，避免误触）
  if (!finished) {
    if (!hintShown) return;
    const sc = SHAPES[shapeIndex];
    hintShown = false;
    hideHint();
    if (sc.action === 'blast') {
      // 标记为流程进行中，并重置计时，防止提示被重新显示
      scenePending = true;
      lastShapeAt = nowEt;
      // ① 先引导许愿（烛火变旺，安静几秒）
      showWishMoment();
      playDing(1.15);
      setTimeout(() => {
        // ② 许愿结束 → 爆炸
        hideWishMoment();
        cakeBlast();
        // ③ 爆炸后先说：恭喜你的愿望一定会成功实现
        setTimeout(() => {
          setWishCard('🎉', '', CHEER_TEXT);
          showWishCard();
        }, 950);
        // ④ 再换成「我也为你许了一个愿望 · 祝你考研一定上岸！」
        setTimeout(() => {
          setWishCard('🎓', WISH_CARD_TITLE, WISH_CARD_TEXT);
        }, 3500);
        setTimeout(() => hideWishCard(), 6300);
        // ⑤ 卡片淡出后，打字机真心话
        setTimeout(() => playWonderText(), 7200);
        setTimeout(() => hideWonderText(), 12700);
        // ⑥ 再进入下一幕
        setTimeout(() => goNextScene(), 13600);
      }, WISH_SECONDS);
    } else {
      goNextScene();
    }
    return;
  }
  // 自由阶段：点击 = 放烟花
  fireAt(x, y);
}

window.addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY));
window.addEventListener('touchstart', (e) => {
  const t0 = e.touches[0];
  mouse.x = t0.clientX;
  mouse.y = t0.clientY;
  handleTap(t0.clientX, t0.clientY);
}, { passive: true });

/* ══════════════════════════════════════════════════════════════
   🎬 分幕推进（每一步都由观看者点击驱动）
   ══════════════════════════════════════════════════════════════ */
let hintShown = false;
let finished = false;
let nowEt = 0;
let scenePending = false;   // 正在执行「点蛋糕 → 许愿 → 爆炸」流程，期间不再显示提示

const hintEl = document.getElementById('hintNext');
const hintTextEl = document.getElementById('hintText');
const hintIconEl = document.getElementById('hintIcon');

function showHint(text, icon) {
  hintTextEl.textContent = text;
  hintIconEl.textContent = icon || '👆';
  hintEl.style.display = 'flex';
  void hintEl.offsetWidth;
  hintEl.classList.add('show');
}

function hideHint() {
  // 立即消失（不走淡出），避免任何残留
  hintEl.classList.remove('show');
  hintEl.style.display = 'none';
}

// 轻快的「叮」声（每次推进的反馈音）
function playDing(pitch, vol) {
  if (!ensureAudioEngine()) return;
  try {
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sine';
    const base = 740 * (pitch || 1);
    osc.frequency.setValueAtTime(base, t);
    osc.frequency.exponentialRampToValueAtTime(base * 1.5, t + 0.1);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.11, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    osc.connect(g);
    g.connect(actx.destination);
    osc.start(t);
    osc.stop(t + 0.65);
  } catch (e) { /* 忽略 */ }
}

// —— 许愿时刻 / 愿望卡片 ——
let wishingMode = false;
const wishMomentEl = document.getElementById('wishMoment');
const wishCardEl = document.getElementById('wishCard');

let wishMomentHideTimer = null;
let wishCardHideTimer = null;

function showWishMoment() {
  wishingMode = true;
  clearTimeout(wishMomentHideTimer);
  wishMomentEl.style.transition = '';
  wishMomentEl.style.display = 'flex';
  void wishMomentEl.offsetWidth;              // 强制重排，保证淡入过渡生效
  wishMomentEl.classList.add('show');
}
function hideWishMoment() {
  wishingMode = false;
  clearTimeout(wishMomentHideTimer);
  wishMomentHideTimer = null;
  // 立即消失：先关过渡再隐藏，避免任何淡出残留
  wishMomentEl.style.transition = 'none';
  wishMomentEl.classList.remove('show');
  wishMomentEl.style.display = 'none';

    wishMomentEl.style.transition = '';
  });
}
const wishCardIconEl = document.getElementById('wishCardIcon');
const wishCardTitleEl = document.getElementById('wishCardTitle');
const wishCardTextEl = document.getElementById('wishCardText');

// 动态替换卡片内容（标题为空则隐藏标题行）
function setWishCard(icon, title, text) {

function showWishCard() {

}
function hideWishCard() {

// —— 好奇追问（打字机逐字浮现）——
let wonderInterval = null;
let wonderHideTimer = null;
const wonderEl = document.getElementById('wonderText');
const wonderLineEl = document.getElementById('wonderLine');
const wonderCursorEl = document.getElementById('wonderCursor');

function playWonderText() {

  wonderEl.style.display = 'block';
  wonderEl.classList.remove('done');
  void wonderEl.offsetWidth;

      wonderCursorEl.style.display = 'none';    // 打完隐藏光标

  }, 900);

// 推进到下一幕
// 一次性清掉所有浮层（防止任何残留）
function hideAllOverlays() {
  hideWishMoment();
  hideWishCard();
  hideWonderText();
  hideHint();
}

function goNextScene() {
  const next = shapeIndex + 1;
  lastShapeAt = nowEt;
  hintShown = false;
  blasted = false;
  scenePending = false;
  hideAllOverlays();

  if (next >= SHAPES.length) {
    // 全部演完 → 自动循环播放（不显示任何提示）
    finished = true;
    shapeIndex = 0;
    lastShapeAt = nowEt;
    morphTo(0, true);
    volley();
    return;
  }

  shapeIndex = next;
  morphTo(shapeIndex, true);
  playDing(1);
}

/* ══════════════════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════════════════ */
let lastShapeAt = 0;
let lastAutoFw = 0;
let running = false;
let startTime = 0;

function frame(t) {
  if (!running) return;
  if (!startTime) startTime = t;
  const et = t - startTime;

  /* ---- 场景拖尾 ---- */
  sctx.globalCompositeOperation = 'source-over';
  sctx.fillStyle = 'rgba(4,2,10,0.34)';
  sctx.fillRect(0, 0, W, H);

  sctx.globalCompositeOperation = 'lighter';

  /* ---- 星云（缓慢流动 + 鼠标视差）---- */
  const nx = Math.sin(et * 0.000055) * 34 + mouse.px * 26;
  const ny = Math.cos(et * 0.000041) * 24 + mouse.py * 26;
  sctx.globalAlpha = 1;
  sctx.drawImage(nebC, nx - 40, ny - 30, W + 80, H + 60);

  /* ---- 星空 ---- */
  drawStars(et, mouse.px * W, mouse.py * H);

  /* ---- 主粒子（形态切换瞬间不施加涡旋，收敛更利落）---- */
  const since = et - lastShapeAt;
  const swirlMax = IS_MOBILE ? 0.026 : 0.052;
  const swirl = since < 900 ? 0 : Math.min(1, (since - 900) / 1400) * swirlMax;
  for (const p of particles) {
    p.update(et, mouse.x, mouse.y, swirl);
    p.draw(et);
  }

  /* ---- 烟花 ---- */
  updateFireworks();

  /* ---- 自动烟花 ---- */
  if (et - lastAutoFw > QUALITY.fireworkEvery) {
    lastAutoFw = et;
    volley();
  }

  /* ---- 🎂 蛋糕：烛火摇曳（等观看者点击吹蜡烛才炸开）---- */
  if (SHAPES[shapeIndex].kind === 'cake') {
    const cg = cakeGeom();
    const flameCount = wishingMode ? 9 : 3;   // 许愿时烛火更旺
    for (let i = 0; i < flameCount; i++) spawnFlame(cg);
  }
  updateFlames();

  /* ---- 分幕交互：粒子稳定后提示「点击继续」---- */
  nowEt = et;
  if (entered && !finished && !scenePending && !hintShown && since > 1700) {
    hintShown = true;
    const sc = SHAPES[shapeIndex];
    showHint(sc.hint || '点击继续', sc.icon || '👆');
  }

  /* ---- 全部演完后：形态自动循环播放 ---- */
  if (finished && et - lastShapeAt > SHAPE_DURATION) {
    lastShapeAt = et;
    shapeIndex = (shapeIndex + 1) % SHAPES.length;
    blasted = false;                                  // 重置，让蛋糕每轮都能再炸
    morphTo(shapeIndex, true);
  }

  /* ---- 循环模式下，蛋糕到点自动炸开 ---- */
  if (finished && SHAPES[shapeIndex].kind === 'cake' && !blasted && since > SHAPE_DURATION * 0.55) {
    blasted = true;
    cakeBlast();
  }

  /* ---- 浮层看门狗：任何情况下卡住的浮层都会被强制隐藏 ---- */
  if (!wishingMode && !wishMomentEl.classList.contains('show') && wishMomentEl.style.display !== 'none') {
    wishMomentEl.style.display = 'none';
  }
  if (!wishCardEl.classList.contains('show') && wishCardEl.style.display !== 'none') {
    wishCardEl.style.display = 'none';
  }
  if (!wonderEl.classList.contains('show') && wonderEl.style.display !== 'none') {
    wonderEl.style.display = 'none';
  }

  /* ---- 帧率监测：持续掉帧则自动降级 ---- */
  if (lastFrameT) {
    fpsAcc += t - lastFrameT;
    fpsCount++;
    if (fpsCount >= 50) {
      const avg = fpsAcc / fpsCount;
      if (!degraded && avg > 40 && particles.length > 1300) {
        degraded = true;
        bloomEnabled = false;
        if (particles.length > 2000) particles.length = Math.floor(particles.length * 0.7);
      }
      fpsAcc = 0;
      fpsCount = 0;
    }
  }
  lastFrameT = t;

  /* ---- Bloom 泛光后处理（手机默认关闭）---- */
  if (bloomEnabled) {
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.clearRect(0, 0, BW, BH);
    bctx.globalCompositeOperation = 'source-over';
    if ('filter' in bctx) bctx.filter = 'blur(2px)';
    bctx.drawImage(scene, 0, 0, BW, BH);
    if ('filter' in bctx) bctx.filter = 'none';
  }

  /* ---- 合成到屏幕 ---- */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(scene, 0, 0, stage.width, stage.height);

  if (bloomEnabled) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.34;
    ctx.drawImage(bloomC, 0, 0, stage.width, stage.height);
    ctx.globalAlpha = 1;
  }

  // 蛋糕炸开瞬间的全屏闪光
  if (flash > 0.012) {
    ctx.fillStyle = 'rgba(255,244,226,' + (flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, stage.width, stage.height);
    flash *= 0.86;
  } else if (flash !== 0) {
    flash = 0;
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════
   🎵 背景音乐（Web Audio 实时合成 · 原创温馨旋律，无需音频文件）
   ══════════════════════════════════════════════════════════════ */
const musicBtn = document.getElementById('musicBtn');
const musicIcon = document.getElementById('musicIcon');

let actx = null;
let masterGain = null;
let musicTimer = null;
let musicOn = false;
let mStep = 0;
let nextNoteTime = 0;

// 原创和弦进行（C - G - Am - F，经典温馨走向）
const PROG = [
  { bass: 130.81, arp: [261.63, 329.63, 392.00, 523.25] }, // C
  { bass: 196.00, arp: [293.66, 392.00, 493.88, 587.33] }, // G
  { bass: 220.00, arp: [261.63, 329.63, 440.00, 523.25] }, // Am
  { bass: 174.61, arp: [261.63, 349.23, 440.00, 523.25] }, // F
];
const STEP_TIME = 0.6;   // 每拍时长（秒）→ 舒缓节奏

function buildAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  actx = new AC();

  masterGain = actx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(actx.destination);

  // 简易混响（延迟反馈）
  const delay = actx.createDelay(1.2);
  delay.delayTime.value = 0.3;
  const fb = actx.createGain();
  fb.gain.value = 0.34;
  const wet = actx.createGain();
  wet.gain.value = 0.42;
  masterGain.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(actx.destination);
  return true;
}

// 音乐盒音色：基音 + 泛音
function note(freq, when, dur, vol) {
  const partials = [
    [1, vol],
    [2, vol * 0.26],
    [3, vol * 0.1],
    [4.2, vol * 0.045],
  ];
  for (const [mult, v] of partials) {
    if (v < 0.004) continue;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(v, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(when);
    osc.stop(when + dur + 0.08);
  }
}

function scheduler() {
  if (!actx || !musicOn) return;
  while (nextNoteTime < actx.currentTime + 0.9) {
    const chord = PROG[Math.floor(mStep / 4) % PROG.length];
    const pos = mStep % 4;

    if (pos === 0) {
      note(chord.bass, nextNoteTime, 2.6, 0.15);
      note(chord.bass / 2, nextNoteTime, 3.0, 0.09);
    }
    note(chord.arp[pos], nextNoteTime, 1.7, 0.075);

    if (pos === 2 && Math.random() < 0.55) {
      note(chord.arp[3] * 1.5, nextNoteTime + 0.28, 1.2, 0.04);
    }
    if (pos === 3 && Math.random() < 0.3) {
      note(chord.arp[2] * 2, nextNoteTime + 0.15, 0.9, 0.032);
    }

    nextNoteTime += STEP_TIME;
    mStep++;
  }
}

function updateMusicUI() {
  musicIcon.textContent = musicOn ? '🔊' : '🔈';
  musicBtn.classList.toggle('playing', musicOn);
}

// ---- 音频引擎（仅用于音效：叮声 / 炸开轰鸣）----
function ensureAudioEngine() {
  if (!actx && !buildAudio()) return false;
  if (actx.state === 'suspended') actx.resume();
  return true;
}

// ---- 合成音乐（仅在 mp3 加载失败时回退使用）----
function startSynthMusic() {
  if (!actx) return;
  masterGain.gain.cancelScheduledValues(actx.currentTime);
  masterGain.gain.setValueAtTime(masterGain.gain.value, actx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.5, actx.currentTime + 1.8);
  if (!musicTimer) {
    nextNoteTime = actx.currentTime + 0.12;
    musicTimer = setInterval(scheduler, 220);
  }
}

function stopSynthMusic() {
  if (!actx) return;
  masterGain.gain.cancelScheduledValues(actx.currentTime);
  masterGain.gain.setValueAtTime(masterGain.gain.value, actx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.7);
  const t = musicTimer;
  musicTimer = null;
  setTimeout(() => { if (t) clearInterval(t); }, 850);
}

// ---- 背景音乐：播放 333.mp3 ----
const bgmEl = document.getElementById('bgm');
const BGM_VOLUME = 0.55;      // 背景音乐音量（0~1），想更轻就调小
let bgmReady = false;

function startMusic() {
  ensureAudioEngine();          // 音效引擎（叮声 / 轰鸣）
  musicOn = true;
  updateMusicUI();

  bgmEl.volume = BGM_VOLUME;
  const pr = bgmEl.play();
  if (pr && pr.then) {
    pr.then(() => { bgmReady = true; })
      .catch(() => { startSynthMusic(); });   // mp3 不可用 → 回退合成音乐
  }
}

function stopMusic() {
  musicOn = false;
  updateMusicUI();
  try { bgmEl.pause(); } catch (e) { /* 忽略 */ }
  stopSynthMusic();
}

musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (musicOn) stopMusic(); else startMusic();
});

// ---- 开场引导层：必须由观看者主动点击，音乐才开始播放 ----
const gateEl = document.getElementById('gate');
const gateBtnEl = document.getElementById('gateBtn');
document.getElementById('gateTitle').textContent = GATE_TITLE;
document.getElementById('gateSub').textContent = GATE_SUB;
// 许愿环节文案（改文件顶部的常量即可）
document.getElementById('wishMomentText').textContent = WISH_HINT;
document.getElementById('wishCardTitle').textContent = WISH_CARD_TITLE;
document.getElementById('wishCardText').textContent = WISH_CARD_TEXT;

function enterWithMusic() {
  if (entered) return;
  entered = true;
  gateEl.classList.add('hide');
  setTimeout(() => { gateEl.style.display = 'none'; }, 900);
  startMusic();                    // 用户主动点击 → 浏览器允许播放
}

gateBtnEl.addEventListener('click', (e) => {
  e.stopPropagation();
  enterWithMusic();
});

/* ══════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════ */
let firstBoot = true;

function boot() {
  resize();
  buildNebula();
  buildStars();
  particles = [];
  for (let i = 0; i < MAX_PARTICLES; i++) particles.push(new Particle());

  if (firstBoot) {
    // 首次启动：从第一幕开始
    firstBoot = false;
    shapeIndex = 0;
    startTime = 0;
    lastShapeAt = 0;
    hintShown = false;
    finished = false;
    blasted = false;
    scenePending = false;
    hideAllOverlays();
  }
  // 重建时保持当前这一幕，不让剧情重来
  morphTo(shapeIndex, false);

  running = true;
  requestAnimationFrame(frame);

  if (firstBoot === false && startTime === 0) {
    // 开场：三连发烟花
    setTimeout(() => burst(W * 0.24, H * 0.3, { type: 'peony', scale: 1.05 }), 420);
    setTimeout(() => burst(W * 0.76, H * 0.26, { type: 'chrys', scale: 1.05 }), 780);
    setTimeout(() => burst(W * 0.5, H * 0.16, { type: 'heart', scale: 1.15 }), 1200);
  }
}

boot();

let rt;
function handleViewportChange() {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const v = measureViewport();
    const dw = Math.abs(v.w - W);
    const dh = Math.abs(v.h - H);
    if (dw < 2 && dh < 2) return;                 // 尺寸没变，忽略
    // 只有横竖屏切换这种大变化才重建（字号需要重新采样）
    if (dw > 140 || dh > 220) {
      running = false;
      boot();
    } else {
      softResize(v.w, v.h);                       // 小幅变化 → 仅等比缩放，画面不重来
    }
  }, 280);
}
window.addEventListener('resize', handleViewportChange);
window.addEventListener('orientationchange', () => {
  // 旋转后尺寸变化有延迟，多等一会再重建
  clearTimeout(rt);
  rt = setTimeout(() => {
    const v = measureViewport();
    if (Math.abs(v.w - W) > 60 || Math.abs(v.h - H) > 60) {
      running = false;
      boot();
    }
  }, 520);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewportChange);
}
</script>
