<!DOCTYPE html>
<html lang="zh-CN">
<!-- 
  署名：X星G辰X
  作品名称：3D粒子蛋糕 · 星辰
  作品介绍：基于Three.js打造的3D粒子特效生日蛋糕，包含动态粒子聚合、流光粒子环、流星特效、Bloom光效等视觉效果，
           点击/触摸触发粒子聚合动画，伴随背景音乐播放，适配移动端与桌面端，打造沉浸式生日祝福体验。
  技术栈：Three.js、WebGL、HTML5、JavaScript
  【注释】代码基本分段打上了注释/如果有看不懂的可以百度
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ 有份小惊喜</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #06060f;
        }
      /* ===== 叠加层样式（不影响 555 的 3D 场景）===== */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; }
  body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }

  /* —— 时间锁 —— */
  #lock {
    position: fixed; inset: 0; z-index: 90;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6,3,14,.72);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    text-align: center; padding: 20px;
    transition: opacity .9s ease;
    font-family: "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  }
  #lock.hide { opacity: 0; pointer-events: none; }
  .lock-icon { font-size: 56px; margin-bottom: 22px; animation: lockFloat 3.4s ease-in-out infinite; filter: drop-shadow(0 0 26px rgba(255,180,220,.8)); }
  @keyframes lockFloat { 0%,100% { transform: translateY(0) rotate(-5deg) scale(1); } 50% { transform: translateY(-12px) rotate(6deg) scale(1.07); } }
  .lock-title {
    font-size: 22px; font-weight: 700; letter-spacing: 4px; margin-bottom: 12px;
    background: linear-gradient(92deg,#ffd9e8,#ffb3d1 40%,#ffd9a8 76%,#d9b8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,140,190,.65));
  }
  .lock-sub { font-size: 14px; letter-spacing: 3px; color: rgba(255,225,240,.72); margin-bottom: 32px; }
  .lock-cd { display: flex; gap: 14px; margin-bottom: 26px; }
  .lock-cd .cd-item {
    min-width: 62px; padding: 12px 8px; border-radius: 14px;
    background: rgba(30,16,40,.55); border: 1px solid rgba(255,190,220,.24);
    box-shadow: 0 0 22px rgba(255,107,157,.18);
  }
  .lock-cd .cd-item span { display: block; font-size: 25px; font-weight: 700; color: #ffe3ef; text-shadow: 0 0 16px rgba(255,150,200,.85); font-variant-numeric: tabular-nums; }
  .lock-cd .cd-item label { display: block; margin-top: 6px; font-size: 11px; letter-spacing: 2px; color: rgba(255,214,232,.6); }
  .lock-hint { font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.32); }

  /* —— 开场引导层 —— */
  #gate {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6,3,14,.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .85s ease, visibility .85s;
    font-family: "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  }
  #gate.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-icon { font-size: 60px; margin-bottom: 20px; animation: gateFloat 3.2s ease-in-out infinite; filter: drop-shadow(0 0 22px rgba(255,160,200,.75)); }
  @keyframes gateFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-11px) scale(1.07); } }
  .gate-title {
    font-size: 28px; font-weight: 700; letter-spacing: 5px; margin-bottom: 12px;
    background: linear-gradient(92deg,#ffd9e8,#ffb3d1 30%,#ffe6a7 62%,#d9b8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,140,190,.6));
  }
  .gate-sub { font-size: 14px; letter-spacing: 3px; color: rgba(255,225,240,.75); margin-bottom: 34px; }
  .gate-btn {
    padding: 15px 42px; border-radius: 999px; cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,190,220,.5);
    background: linear-gradient(135deg, rgba(255,140,190,.3), rgba(200,130,255,.26));
    color: #fff; font-size: 15px; letter-spacing: 2px;
    animation: gateGlow 2.6s ease-in-out infinite; transition: transform .25s ease;
  }
  .gate-btn:hover { transform: translateY(-2px) scale(1.05); }
  @keyframes gateGlow {
    0%,100% { box-shadow: 0 0 26px rgba(255,107,157,.35), inset 0 0 18px rgba(255,180,220,.12); }
    50% { box-shadow: 0 0 44px rgba(255,107,157,.62), inset 0 0 26px rgba(255,180,220,.2); }
  }

  /* —— 底部字幕轮播 —— */
  #subs {
    position: fixed; left: 0; right: 0; bottom: 44px; z-index: 20;
    text-align: center; pointer-events: none;
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    opacity: 0; transition: opacity 1.4s ease;
  }
  #subs.show { opacity: 1; }
  #subs .sub-line {
    position: absolute; left: 0; right: 0; opacity: 0;
    font-size: 15px; letter-spacing: 4px; color: #ffd6e8;
    text-shadow: 0 0 14px rgba(255,140,190,.85), 0 0 34px rgba(200,140,255,.5);
  }
  @keyframes subFade {
    0% { opacity: 0; transform: translateY(8px); }
    4% { opacity: 1; transform: translateY(0); }
    14% { opacity: 1; transform: translateY(0); }
    18% { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 0; }
  }

  /* —— 文案卡片（放在画面上方，不遮挡蛋糕）—— */
  .msg-card {
    position: fixed; left: 50%; top: 9%; z-index: 30;
    display: none; transform: translate(-50%, -16px) scale(.97);
    opacity: 0; pointer-events: none; text-align: center;
    max-width: 84vw;
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    transition: opacity .85s ease, transform .85s cubic-bezier(.2,.9,.3,1.25);
  }
  .msg-card.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .msg-card .mc-icon { font-size: 34px; margin-bottom: 10px; }
  .msg-card .mc-title { font-size: 13px; letter-spacing: 3px; color: rgba(255,228,240,.82); margin-bottom: 8px; }
  .msg-card .mc-text {
    font-size: 19px; font-weight: 600; letter-spacing: 2.5px; line-height: 1.85;
    white-space: pre-line;              /* 让文案里的换行生效 */
    background: linear-gradient(92deg,#ffd9e4,#ffe9c4 42%,#ffc4d6 76%,#ffd9e4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,170,200,.85));
  }
  .msg-card .mc-cursor {
    display: inline-block; width: 2px; height: 1em; vertical-align: -.13em;
    background: #ffd6e8; margin-left: 4px;
    animation: cursorBlink .85s step-end infinite;
  }
  @keyframes cursorBlink { 50% { opacity: 0; } }
  .msg-card.done .mc-title { opacity: 1; }

  /* ===== 大屏清晰文本（粒子成型后替换显示，保证可读性）===== */
  #bigText {
    position: fixed; left: 50%; top: 21%; z-index: 36;
    transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none; text-align: center;
    max-width: 94vw;
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    transition: opacity .55s ease;
  }
  #bigText.show { opacity: 1; }
  #bigText .line {
    /* 字号由 JS 动态计算，以与粒子文字完全一致 */
    font-weight: 700; letter-spacing: 0; line-height: 1.16;
    color: #fff;
    text-shadow:
      0 0 14px rgba(255,200,230,.95),
      0 0 34px rgba(255,150,205,.75),
      0 0 70px rgba(205,130,255,.45);
  }
  #bigText .line + .line { margin-top: 0; }

  /* ===== 聚合过程中的悬念文案（空旷的上方，可稍醒目）*/
  #guessMsg .mc-text { font-size: 20px; letter-spacing: 3px; }
  #guessMsg .mc-icon { font-size: 34px; margin-bottom: 10px; animation: wishCandle 3.4s ease-in-out infinite; }

  /* 蛋糕成型瞬间的揭晓（更有仪式感）*/
  #yesMsg .mc-text { font-size: 21px; letter-spacing: 3px; }
  #yesMsg .mc-icon { font-size: 36px; margin-bottom: 10px; animation: wishCandle 2.8s ease-in-out infinite; }

  /* 许愿提示（稍醒目）*/
  #wishMsg .mc-text { font-size: 22px; letter-spacing: 4px; }
  #wishMsg .mc-icon { font-size: 46px; animation: wishCandle 2.3s ease-in-out infinite; filter: drop-shadow(0 0 28px rgba(255,200,120,.9)); }
  @keyframes wishCandle { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.14) translateY(-7px); } }

  /* 许愿倒计时数字 */
  .mc-count {
    margin-top: 16px;
    font-size: 44px; font-weight: 700;
    color: #ffe9f2;
    text-shadow: 0 0 20px rgba(255,150,200,.95), 0 0 46px rgba(255,107,157,.65);
    font-variant-numeric: tabular-nums;
  }
  .mc-count.tick { animation: countPulse .95s ease-out; }
  @keyframes countPulse {
    0%   { transform: scale(1.55); opacity: .25; }
    55%  { transform: scale(1);    opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }

  /* 压轴祝福词：位置更靠上 + 半透明底衬，避免与蛋糕视觉打架 */
  #blessMsg {
    top: 5.5%;
    padding: 18px 28px;
    border-radius: 20px;
    background: rgba(10, 6, 20, .44);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    border: 1px solid rgba(255, 190, 220, .14);
    box-shadow: 0 0 40px rgba(120, 60, 140, .22);
  }
  #blessMsg .mc-text { font-size: 16px; letter-spacing: 1.5px; line-height: 1.95; }
  #blessMsg .mc-icon { font-size: 26px; margin-bottom: 8px; animation: wishCandle 3s ease-in-out infinite; }

  /* —— 音乐按钮 —— */
  #musicBtn {
    position: fixed; right: 22px; bottom: 22px; z-index: 40;
    width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,190,220,.35);
    background: rgba(30,16,40,.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #ffd6e8; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,107,157,.28);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #musicBtn:hover { transform: scale(1.1); box-shadow: 0 0 34px rgba(255,107,157,.55); }

  /* —— 手机适配 —— */
  @media (max-width: 640px), (orientation: portrait) and (max-width: 900px) {
    .lock-icon { font-size: 44px; margin-bottom: 16px; }
    .lock-title { font-size: 17px; letter-spacing: 2.5px; }
    .lock-sub { font-size: 12px; letter-spacing: 2px; margin-bottom: 24px; }
    .lock-cd { gap: 9px; }
    .lock-cd .cd-item { min-width: 52px; padding: 10px 6px; }
    .lock-cd .cd-item span { font-size: 20px; }
    .lock-hint { font-size: 10.5px; }
    .gate-icon { font-size: 48px; margin-bottom: 16px; }
    .gate-title { font-size: 21px; letter-spacing: 3px; }
    .gate-sub { font-size: 12.5px; letter-spacing: 2px; margin-bottom: 26px; }
    .gate-btn { padding: 13px 28px; font-size: 14px; }
    #subs { bottom: 34px; }
    #subs .sub-line { font-size: 12.5px; letter-spacing: 2px; }
    .msg-card { top: 6.5%; max-width: 90vw; }
    .msg-card .mc-text { font-size: 15.5px; letter-spacing: 1.5px; line-height: 1.8; }
    .msg-card .mc-icon { font-size: 28px; margin-bottom: 8px; }
    .msg-card .mc-title { font-size: 11.5px; letter-spacing: 2px; }
    #wishMsg .mc-text { font-size: 18px; letter-spacing: 2.5px; }
    #wishMsg .mc-icon { font-size: 38px; }
    .mc-count { font-size: 34px; margin-top: 12px; }
    #bigText { max-width: 96vw; }
    #guessMsg .mc-text { font-size: 15.5px; letter-spacing: 2px; }
    #guessMsg .mc-icon { font-size: 26px; margin-bottom: 8px; }
    #yesMsg .mc-text { font-size: 16.5px; letter-spacing: 2px; }
    #yesMsg .mc-icon { font-size: 28px; margin-bottom: 8px; }
    #blessMsg { top: 4%; padding: 14px 18px; max-width: 92vw; }
    #blessMsg .mc-text { font-size: 13px; letter-spacing: 1px; line-height: 1.9; }
    #blessMsg .mc-icon { font-size: 22px; margin-bottom: 6px; }
  }

</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════
   叠加逻辑：时间锁 / 引导 / 打字机文案 / 音乐
   （完全独立于 555 的 3D 场景，不修改它的视觉逻辑）
   ══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ---------- 可自定义文案 ---------- */
  const GATE_TITLE = '高怡，生日快乐';
  const GATE_SUB = '你的好友小李给你的祝福';
  const SUBTITLES = [
    '很高兴认识你',
    '认识你之后，我也开心了很多',
    '生日快乐，高怡',
    '祝你考研一定上岸',
    '希望你以后轻松一点，也快乐一点',
    '—— 你的好友小李',
  ];
  const WISH_TEXT = '闭上眼睛，许个愿吧';
  // 蛋糕形成过程中的悬念文案
  const GUESS_TEXT =
    '今天是一个特殊的日子\n' +
    '你猜猜是什么呢？';
  // 蛋糕即将成型时的揭晓
  const YES_TEXT = '没错，今天是属于你的生日！';
  const CHEER_TEXT = '恭喜你的愿望一定会成功实现';
  const KAOYAN_TITLE = '我也为你许了一个愿望';
  const KAOYAN_TEXT = '祝你考研一定上岸！';
  const TALK_TEXT =
    '不知道你偷偷许了什么愿望呢？\n\n' +
    '很高兴认识你。\n' +
    '认识你之后，我也开心了很多。';
  // 压轴祝福：拆成单句，每句都用粒子爆炸独占大屏展示（单行更扁，不遮挡蛋糕）
  const BLESS_LINES = [
    ['愿你考研一定上岸'],
    ['努力的人，运气都不会太差'],
    ['愿你家人平安幸福'],
    ['也愿你被爱包围着'],
    ['生日快乐！高怡'],
  ];

  // 打字速度（毫秒/字）
  const SPEED = { wish: 120, cheer: 105, kaoyanTitle: 115, kaoyanText: 125, talk: 110, bless: 105 };

  const LOCK_TITLE = '✨ 有份小惊喜';
  const REAL_TITLE = '🎂 生日快乐 🎂';
  const UNLOCK_DATE = new Date('2026-09-25T00:00:00');

  /* ---------- 元素 ---------- */
  const params = new URLSearchParams(location.search);
  const $ = function (id) { return document.getElementById(id); };
  const lockEl = $('lock');
  const gateEl = $('gate');
  const gateBtnEl = $('gateBtn');
  const subsEl = $('subs');
  const wishMsg = $('wishMsg'), cheerMsg = $('cheerMsg'), kaoyanMsg = $('kaoyanMsg'), talkMsg = $('talkMsg'), blessMsg = $('blessMsg'), guessMsg = $('guessMsg'), yesMsg = $('yesMsg');
  const musicBtn = $('musicBtn');
  const bgm = $('bgm');

  $('gateTitle').textContent = GATE_TITLE;
  $('gateSub').textContent = GATE_SUB;

  /* ---------- 字幕轮播 ---------- */
  SUBTITLES.forEach(function (s, i) {
    const el = document.createElement('span');
    el.className = 'sub-line';
    el.textContent = s;
    el.style.animation = 'subFade ' + (SUBTITLES.length * 3) + 's linear infinite';
    el.style.animationDelay = (i * 3) + 's';
    subsEl.appendChild(el);
  });

  /* ---------- 卡片显示 / 隐藏 ---------- */
  function showCard(el) {
    el.style.display = 'block';
    void el.offsetWidth;
    el.classList.add('show');
  }
  function hideCard(el) {
    el.classList.remove('show');
    setTimeout(function () { el.style.display = 'none'; }, 900);
  }

  /* ---------- 通用打字机（逐字浮现 + 闪烁光标）---------- */
  const timers = [];
  function typeInto(textEl, cursorEl, text, speed, onDone) {
    return new Promise(function (resolve) {
      textEl.textContent = '';
      if (cursorEl) cursorEl.style.display = 'inline-block';
      let i = 0;
      const t = setInterval(function () {
        i++;
        textEl.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(t);
          if (cursorEl) cursorEl.style.display = 'none';
          if (onDone) onDone();
          resolve();
        }
      }, speed);
      timers.push(t);
    });
  }
  function clearAllTypers() {
    timers.forEach(function (t) { clearInterval(t); });
    timers.length = 0;
  }

  /* ---------- 大屏清晰文本（与粒子文字尺寸/位置完全一致 → 无缝替换）---------- */
  const bigTextEl = document.getElementById('bigText');
  function showBigText(fallbackLines) {
    const meta = window.__BURST_META__;
    const lines = (meta && meta.lines && meta.lines.length) ? meta.lines : fallbackLines;

    let fontSize = 44;          // 兜底字号
    let topPx = window.innerHeight * 0.21;
    let useExact = false;

    if (meta && meta.textW && meta.maxChars && meta.visH) {
      // 世界单位 → 屏幕 CSS 像素 的换算比例
      const scale = window.innerHeight / meta.visH;
      // 单个字符的世界宽度（中文字宽 ≈ 字号）
      const charW = meta.textW / meta.maxChars;
      fontSize = charW * scale * 1.0;                 // 与粒子字宽一致
      topPx = window.innerHeight / 2 - meta.cyOffset * scale;   // 与粒子中心对齐
      useExact = true;
    }

    bigTextEl.innerHTML = lines.map(function (l) {
      return '<div class="line" style="font-size:' + fontSize.toFixed(1) + 'px;line-height:1.16">'
        + l + '</div>';
    }).join('');
    bigTextEl.style.top = topPx.toFixed(1) + 'px';
    bigTextEl.classList.add('show');
    return useExact;
  }
  function hideBigText() {
    bigTextEl.classList.remove('show');
  }

  /* ---------- 许愿倒计时（3 秒）---------- */
  let beepCtx = null;
  function beep(freq, vol) {
    try {
      if (!beepCtx) beepCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = beepCtx.currentTime;
      const osc = beepCtx.createOscillator();
      const g = beepCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      osc.connect(g);
      g.connect(beepCtx.destination);
      osc.start(t);
      osc.stop(t + 0.46);
    } catch (e) { /* 忽略 */ }
  }

  function runWishCountdown() {
    const el = $('wishCount');
    el.style.display = 'block';
    let n = 3;
    function tick() {
      el.textContent = String(n);
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      beep(n === 1 ? 1180 : 880, 0.075);
      if (n === 1) {
        // 倒计时结束：轻柔的高音收尾
        setTimeout(function () { beep(1500, 0.1); }, 950);
        return;
      }
      n--;
      setTimeout(tick, 1000);
    }
    tick();
  }

  function setMusicUI() { musicBtn.textContent = musicOn ? '🔊' : '🔈'; }

    musicOn = true; setMusicUI();

      bgm.volume = 0.55;
      const p = bgm.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) { /* 忽略 */ }

  let flowStarted = false;

  function startWishFlow() {
    if (flowStarted) return;

    // ① 许愿（打字完成后 → 3 秒倒计时给她许愿 → 倒计时结束触发英文生日爆炸）
    setTimeout(function () {

    setTimeout(function () {
      showCard(cheerMsg);
      typeInto($('cheerText'), $('cheerCursor'), CHEER_TEXT, SPEED.cheer);
    }, 14500);

    setTimeout(function () {

      });
    }, 20500);
    setTimeout(function () { hideCard(kaoyanMsg); clearAllTypers(); }, 27900);

    setTimeout(function () {
      showCard(talkMsg);
      typeInto($('talkLine'), $('talkCursor'), TALK_TEXT, SPEED.talk, function () {
        setTimeout(function () { hideCard(talkMsg); }, 3600);
      });
    }, 28700);

    // ⑤ 压轴祝福：粒子负责视觉冲击，成型后换成清晰文本供阅读
    setTimeout(startBlessFlow, 36900);
  }

  /* ---------- 压轴祝福流程（纯粒子文字，可被快速预览参数触发）---------- */
  function startBlessFlow() {
    let idx = 0;
    (function nextBless() {
      if (idx >= BLESS_LINES.length) return;          // 演完即定格，不再循环
      const lines = BLESS_LINES[idx++];
      const isLast = idx >= BLESS_LINES.length;
      if (window.__PARTICLE_BURST__) {
        window.__PARTICLE_BURST__(
          lines,
          isLast ? { mode: 'burst', keep: true } : { mode: 'fade', hold: 3.6 }
        );
      }
      if (!isLast) setTimeout(nextBless, 5400);
    })();
  }

  /* ---------- 点击「点亮你的蜡烛」进入 ---------- */
  let entered = false;
  function enter() {
    if (entered) return;
    entered = true;
    gateEl.classList.add('hide');
    setTimeout(function () { gateEl.style.display = 'none'; }, 900);

    startMusic();
    subsEl.classList.add('show');

    // 快速预览：?fastbless=1 → 直接跳到最后的祝福句（用于验证清晰度）
    if (params.has('fastbless')) {
      setTimeout(startBlessFlow, 1200);
      return;
    }

    // 蛋糕形成过程中：先抛出悬念（聚合已延长到 ~16.6s）
    setTimeout(function () {
      showCard(guessMsg);
      typeInto($('guessLine'), $('guessCursor'), GUESS_TEXT, 115);
    }, 2600);
    setTimeout(function () { hideCard(guessMsg); clearAllTypers(); }, 12200);

    // 蛋糕马上形成时：揭晓答案
    setTimeout(function () {
      showCard(yesMsg);
      typeInto($('yesLine'), $('yesCursor'), YES_TEXT, 110);
    }, 13000);
    setTimeout(function () { hideCard(yesMsg); clearAllTypers(); }, 18800);

    // 触发 555 的粒子聚合动画（它监听 window 的 click/touchstart）
    try {
      window.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    } catch (e) {
      try { window.dispatchEvent(new Event('click')); } catch (e2) {}
    }

    // 探测蛋糕成型时刻（555 在 DONE 阶段输出 log「星辰」）
    // 但"许愿"要等「没错，今天是属于你的生日！」说完再开始（约 20s）
    const enterTime = performance.now();
    let flowScheduled = false;
    function scheduleFlow() {
      if (flowScheduled) return;
      flowScheduled = true;
      const elapsed = performance.now() - enterTime;
      setTimeout(startWishFlow, Math.max(0, 20000 - elapsed));
    }
    (function poll() {
      if (window.__CAKE_DONE__) { scheduleFlow(); return; }
      if (!flowScheduled) requestAnimationFrame(poll);
    })();
    setTimeout(scheduleFlow, 18500);   // 兜底
  }
  gateBtnEl.addEventListener('click', function (e) {
    e.stopPropagation();
    enter();
  });

  /* ---------- 时间锁 ---------- */
  const PREVIEW = params.has('preview');
  let lockTimer = null;

  function unlockNow() {
    clearInterval(lockTimer);
    lockTimer = null;
    lockEl.classList.add('hide');
    setTimeout(function () { lockEl.style.display = 'none'; }, 950);
    document.title = REAL_TITLE;
    gateEl.style.display = 'flex';
    gateEl.classList.remove('hide');
  }

  function startCountdown() {
    function tick() {
      const left = UNLOCK_DATE.getTime() - Date.now();
      if (left <= 0) { unlockNow(); return; }
      $('cdD').textContent = String(Math.floor(left / 86400000));
      $('cdH').textContent = String(Math.floor((left % 86400000) / 3600000)).padStart(2, '0');
      $('cdM').textContent = String(Math.floor((left % 3600000) / 60000)).padStart(2, '0');
      $('cdS').textContent = String(Math.floor((left % 60000) / 1000)).padStart(2, '0');
    }
    tick();
    lockTimer = setInterval(tick, 1000);
  }

  if (Date.now() < UNLOCK_DATE.getTime() && !PREVIEW) {
    document.title = LOCK_TITLE;
    lockEl.style.display = 'flex';
    gateEl.style.display = 'none';
    startCountdown();
  } else {
    document.title = REAL_TITLE;
    lockEl.style.display = 'none';
  }

  setMusicUI();
})();
</script>

            }
            const flameCnt = 240;
            for (let i = 0; i < flameCnt; i++) {
                const angle = Math.random() * Math.PI * 2;
                const rad = 0.11 * Math.random();
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                const y = flameYCenter + Math.random() * 0.24;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            while (decorPts.length < decorCnt) {
                const angle = Math.random() * Math.PI * 2;
                const rad = 0.65 + Math.random() * 0.7;
                const y = 0.15 + Math.random() * 1.45;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            const all = [
                ...bottomPts, ...midPts, ...topPts, ...candlePts,
                ...solidBase, ...bottomDisk, ...bottomTopDisk, ...midTopDisk, ...topTopDisk, ...candleTopDisk,
                ...decorPts
            ];
            while (all.length < PARTICLE_COUNT) all.push(new THREE.Vector3(0, 0.8, 0));
            const final = all.slice(0, PARTICLE_COUNT);
            return final.map(v => [v.x, v.y, v.z]);
        }

        function generateScatterPositions() {
            const scatters = [];
            const centerY = 0.6;
            const spiralArmCount = 4;
            const spiralTotalParticles = Math.floor(PARTICLE_COUNT * 0.32);
            const particlesPerArm = Math.floor(spiralTotalParticles / spiralArmCount);
            const sphereParticleCount = PARTICLE_COUNT - (particlesPerArm * spiralArmCount);

            for (let arm = 0; arm < spiralArmCount; arm++) {
                const baseAngle = (arm / spiralArmCount) * Math.PI * 2;
                for (let i = 0; i < particlesPerArm; i++) {
                    const t = i / particlesPerArm;
                    const angle = baseAngle + t * 3.2 * Math.PI;
                    const r = 1.3 + t * 3.2;
                    const y = centerY + (t - 0.45) * 3.8;
                    const x = Math.cos(angle) * r + (Math.random() - 0.5) * 0.5;
                    const z = Math.sin(angle) * r + (Math.random() - 0.5) * 0.5;
                    scatters.push([x, y + (Math.random() - 0.5) * 0.35, z]);
                }
            }
            for (let i = 0; i < sphereParticleCount; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const r = 1.8 + Math.pow(Math.random(), 0.55) * 3.5;
                const x = Math.sin(phi) * Math.cos(theta) * r;
                const y = centerY + Math.sin(phi) * Math.sin(theta) * r;
                const z = Math.cos(phi) * r;
                scatters.push([x, y, z]);
            }
            while (scatters.length < PARTICLE_COUNT) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const r = 2 + Math.random() * 3;
                scatters.push([
                    Math.sin(phi) * Math.cos(theta) * r,
                    centerY + Math.sin(phi) * Math.sin(theta) * r,
                    Math.cos(phi) * r
                ]);
            }
            return scatters.slice(0, PARTICLE_COUNT);
        }

        function generateCakeColors(positions) {
            const colors = [];
            for (let i = 0; i < positions.length; i++) {
                const y = positions[i][1];
                const xAbs = Math.abs(positions[i][0]);
                let r, g, b;
                if (y < -0.3) {
                    r = 0.6 + Math.random() * 0.2; g = 0.38 + Math.random() * 0.2; b = 0.22 + Math.random() * 0.2;
                } else if (y < -0.2) {
                    r = 0.7 + Math.random() * 0.2; g = 0.45 + Math.random() * 0.22; b = 0.28 + Math.random() * 0.2;
                } else if (y < 0.2) {
                    r = 0.8 + Math.random() * 0.15; g = 0.5 + Math.random() * 0.22; b = 0.32 + Math.random() * 0.18;
                } else if (y < 0.65) {
                    r = 0.9 + Math.random() * 0.1; g = 0.65 + Math.random() * 0.18; b = 0.42 + Math.random() * 0.18;
                } else if (y < 1.0) {
                    r = 0.95; g = 0.75 + Math.random() * 0.15; b = 0.5 + Math.random() * 0.2;
                } else {
                    r = 0.95; g = 0.65 + Math.random() * 0.25; b = 0.38 + Math.random() * 0.25;
                }
                if (y > 1.52 && xAbs < 0.28) {
                    r = 1.0; g = 0.45 + Math.random() * 0.45; b = 0.18;
                }
                if (y > 1.48 && y < 1.52 && xAbs < 0.12) {
                    r = 1.0; g = 0.88; b = 0.6;
                }
                colors.push(r, g, b);
            }
            return colors;
        }

        function elasticEaseOut(t) {
            if (t <= 0) return 0;
            if (t >= 1) return 1;
            const c4 = (2 * Math.PI) / 3;
            return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * c4) + 1;
        }

        function getScanRingRadius(y) {
            if (y < 0.18) return 1.16;
            if (y < 0.20) return 1.16 + (0.88 - 1.16) * ((y - 0.18) / 0.02);
            if (y < 0.60) return 0.88;
            if (y < 0.62) return 0.88 + (0.67 - 0.88) * ((y - 0.60) / 0.02);
            if (y < 0.96) return 0.67;
            if (y < 0.98) return 0.67 + (0.13 - 0.67) * ((y - 0.96) / 0.02);
            if (y < 1.50) return 0.13;
            return 0.07;
        }

        function initParticleSystem() {
            cakePositions = generateCakePositions();
            scatterPositions = generateScatterPositions();
            const initColors = generateCakeColors(cakePositions);

            const initPosArray = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                initPosArray[i * 3] = scatterPositions[i][0];
                initPosArray[i * 3 + 1] = scatterPositions[i][1];
                initPosArray[i * 3 + 2] = scatterPositions[i][2];
            }

            particleActivated = new Array(PARTICLE_COUNT).fill(false);
            particleActivationTime = new Array(PARTICLE_COUNT).fill(0);
            particleSettleDuration = new Array(PARTICLE_COUNT).fill(0);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particleSettleDuration[i] = 1.8 + Math.random() * 2.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(initPosArray, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(initColors), 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.038,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });
            particleSystem = new THREE.Points(geometry, particleMat);
            scene.add(particleSystem);
        }

        let scanRingMain = null;
        let scanRingSecondary = null;
        let scanRingMainMat = null;
        let scanRingSecondaryMat = null;

        function createScanRings() {
            const torusGeoMain = new THREE.TorusGeometry(1, 0.025, 20, 120);
            scanRingMainMat = new THREE.MeshBasicMaterial({
                color: 0x22ccff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            scanRingMain = new THREE.Mesh(torusGeoMain, scanRingMainMat);
            scanRingMain.rotation.x = Math.PI / 2;
            scanRingMain.visible = false;
            scene.add(scanRingMain);

            const torusGeoSecondary = new THREE.TorusGeometry(1, 0.018, 16, 100);
            scanRingSecondaryMat = new THREE.MeshBasicMaterial({
                color: 0x9966ff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            scanRingSecondary = new THREE.Mesh(torusGeoSecondary, scanRingSecondaryMat);
            scanRingSecondary.rotation.x = Math.PI / 2;
            scanRingSecondary.visible = false;
            scene.add(scanRingSecondary);
        }

        const ANIM_PHASE = { PRE: 'pre', SCANNING: 'scanning', SETTLING: 'settling', DONE: 'done' };
        let animPhase = ANIM_PHASE.PRE;
        let animStartTime = null;
        let animationStarted = false;
        const SCAN_START_DELAY = 1.8;
        const SCAN_Y_START = -0.65;
        const SCAN_Y_END = 1.72;
        const SCAN_DURATION = 14.8;
        const SCAN_FADE_DURATION = 0.9;
        let scanProgress = 0;
        let scanRingFadeOutStart = false;
        let scanRingFadeOutTime = 0;

        let particleSortedIndices = [];

        function preSortParticles() {
            const indexed = cakePositions.map((pos, i) => ({ idx: i, y: pos[1] }));
            indexed.sort((a, b) => a.y - b.y);
            particleSortedIndices = indexed.map(item => item.idx);
        }

        let lastActivatedSortedIndex = -1;

        function batchActivateParticles(scanY) {
            const activateThreshold = scanY + 0.06;
            while (lastActivatedSortedIndex + 1 < particleSortedIndices.length) {
                const nextIdx = particleSortedIndices[lastActivatedSortedIndex + 1];
                const targetY = cakePositions[nextIdx][1];
                if (targetY <= activateThreshold) {
                    lastActivatedSortedIndex++;
                    if (!particleActivated[nextIdx]) {
                        particleActivated[nextIdx] = true;
                        particleActivationTime[nextIdx] = (performance.now() - animStartTime) / 1000;
                    }
                } else {
                    break;
                }
            }
        }

        function updateParticlePositions(currentTimeSec) {
            if (!particleSystem) return;
            const posArray = particleSystem.geometry.attributes.position.array;
            let anyUpdated = false;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (!particleActivated[i]) continue;
                const elapsed = currentTimeSec - particleActivationTime[i];
                const duration = particleSettleDuration[i];
                if (elapsed >= duration) {
                    if (posArray[i * 3] !== cakePositions[i][0] ||
                        posArray[i * 3 + 1] !== cakePositions[i][1] ||
                        posArray[i * 3 + 2] !== cakePositions[i][2]) {
                        posArray[i * 3] = cakePositions[i][0];
                        posArray[i * 3 + 1] = cakePositions[i][1];
                        posArray[i * 3 + 2] = cakePositions[i][2];
                        anyUpdated = true;
                    }
                    continue;
                }
                const t = elapsed / duration;
                const factor = elasticEaseOut(t);
                const sx = scatterPositions[i][0];
                const sy = scatterPositions[i][1];
                const sz = scatterPositions[i][2];
                const tx = cakePositions[i][0];
                const ty = cakePositions[i][1];
                const tz = cakePositions[i][2];
                posArray[i * 3] = sx + (tx - sx) * factor;
                posArray[i * 3 + 1] = sy + (ty - sy) * factor;
                posArray[i * 3 + 2] = sz + (tz - sz) * factor;
                anyUpdated = true;
            }

            if (anyUpdated) {
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }
        }

        function allParticlesSettled(currentTimeSec) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (!particleActivated[i]) return false;
                if ((currentTimeSec - particleActivationTime[i]) < particleSettleDuration[i]) return false;
            }
            return true;
        }

        let bgTime = 0;
        function animateBackground() {
            bgTime += 0.012;
            stars.rotation.y = bgTime * 0.03;
            stars.rotation.x = Math.sin(bgTime * 0.1) * 0.05;
            ringParticles.rotation.y += 0.003;
            ringParticles.rotation.x = Math.sin(bgTime * 0.5) * 0.1;
            ambientRing.rotation.z += 0.002;
            ambientRing2.rotation.z -= 0.0015;

            // 更新流星位置
            shootingStars.forEach(star => {
                const { line, dir, speed, length, pointsCount, positionsArray } = star;
                const currentHead = new THREE.Vector3(
                    positionsArray[(pointsCount-1)*3],
                    positionsArray[(pointsCount-1)*3+1],
                    positionsArray[(pointsCount-1)*3+2]
                );
                currentHead.add(dir.clone().multiplyScalar(speed));
                
                // 超出边界则重置
                if (currentHead.x < -6 || currentHead.x > 6 || currentHead.y < -4 || currentHead.y > 6 || currentHead.z < -6 || currentHead.z > 4) {
                    const newStartX = (Math.random() - 0.5) * 10;
                    const newStartY = (Math.random() - 0.5) * 6 + 1;
                    const newStartZ = (Math.random() - 0.5) * 6 - 2;
                    const newDir = new THREE.Vector3(
                        -0.8 + Math.random() * 0.4,
                        -0.6 + Math.random() * 0.3,
                        -0.3 + Math.random() * 0.2
                    ).normalize();
                    star.dir.copy(newDir);
                    for (let j = 0; j < pointsCount; j++) {
                        const t = j / (pointsCount - 1);
                        positionsArray[j * 3] = newStartX + newDir.x * t * length;
                        positionsArray[j * 3 + 1] = newStartY + newDir.y * t * length;
                        positionsArray[j * 3 + 2] = newStartZ + newDir.z * t * length;
                    }
                } else {
                    for (let j = 0; j < pointsCount; j++) {
                        const t = j / (pointsCount - 1);
                        positionsArray[j * 3] = currentHead.x - dir.x * (1 - t) * length;
                        positionsArray[j * 3 + 1] = currentHead.y - dir.y * (1 - t) * length;
                        positionsArray[j * 3 + 2] = currentHead.z - dir.z * (1 - t) * length;
                    }
                }
                line.geometry.attributes.position.needsUpdate = true;
            });
        }

        function startAnimation() {
            if (animationStarted) return;
            animationStarted = true;
            animStartTime = performance.now();
            resumeMusic();
            lastActivatedSortedIndex = -1;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particleActivated[i] = false;
                particleActivationTime[i] = 0;
            }
            animPhase = ANIM_PHASE.PRE;
            scanRingMain.visible = false;
            scanRingSecondary.visible = false;
            ambientLight.intensity = 0.08;
            backLight.intensity = 0.15;
            fillLight.intensity = 0.1;
            topHighlight.intensity = 0.05;
            bloomPass.strength = 0.7;
            controls.autoRotate = false;
        }

        // 用户交互触发
        window.addEventListener('click', startAnimation);
        window.addEventListener('touchstart', startAnimation);

        initParticleSystem();
        preSortParticles();
        createScanRings();

        // ========== 电影运镜：聚合过程中镜头由近及远 + 缓慢上摇 ==========
        const CAM_DIR = new THREE.Vector3(3.2, 2.4, 5.2).normalize();
        const CAM_NEAR = 6.0;     // 起始距离（能完整看全形成过程，不贴脸）
        const CAM_FAR = 8.2;      // 结束距离（完整且饱满地呈现蛋糕）
        const DollyEase = (p) => 1 - Math.pow(1 - p, 3);   // easeOutCubic：先快后慢

        function updateCinematicCamera(currentTimeSec) {
            const total = SCAN_START_DELAY + SCAN_DURATION * 0.95;
            const p = Math.min(currentTimeSec / total, 1);
            const ease = DollyEase(p);
            const dist = (CAM_NEAR + (CAM_FAR - CAM_NEAR) * ease) * __camK;
            camera.position.copy(CAM_DIR).multiplyScalar(dist);
            // 视角目标缓慢上移（轻微上摇，增强电影感）
            const lookY = 0.75 + (1.2 - 0.75) * ease;
            controls.target.set(0, lookY, 0);   // controls 每帧会据此计算朝向
            camera.lookAt(0, lookY, 0);
        }

        // ========== 通用「粒子文字爆炸」系统 ==========
        // 用法：window.__PARTICLE_BURST__(['一行文字'], { hold: 4.5 })
        //   - 中心闪光 + 粒子猛烈炸开 → 聚合成文字 → 稳定停留 → 淡出
        //   - 文字贴在相机前方（屏幕位置固定，不随蛋糕自转/镜头环绕移动）
        //   - 支持中英文、多行
        let __hb = null;
        let __hbPhase = 0;        // 0=idle 1=explode 2=gather 2.5=fadeIn 3=hold 4=fadeOut
        let __hbT0 = 0;
        let __hbHold = 7.5;       // 停留时长
        let __hbKeep = false;     // true = 永久保留（不淡出）
        let __hbMode = 'burst';   // 'burst'=爆炸聚合 | 'fade'=直接淡入
        const HB_CAM_DIST = 6.0;  // 文字悬浮在相机前方的距离
        const HB_CY = 1.35;       // 相对视线中心的高度偏移（抬到蛋糕上方，避免遮挡）

        function makeGlowTex() {
            const s = 64;
            const c = document.createElement('canvas');
            c.width = c.height = s;
            const g = c.getContext('2d');
            const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.5, 'rgba(255,255,255,1)');      // 核心更实 → 粒子更亮
            grd.addColorStop(0.78, 'rgba(255,255,255,0.55)');
            grd.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grd;
            g.fillRect(0, 0, s, s);
            return new THREE.CanvasTexture(c);
        }

        function disposeHappy() {
            if (!__hb) return;
            scene.remove(__hb.points);
            __hb.geo.dispose();
            __hb.mat.dispose();
            __hb = null;
        }

        function buildBurstFor(lines) {
            disposeHappy();

            // 手机竖屏：长句自动拆成两行 → 字号翻倍，笔画才看得清
            if (window.innerWidth < window.innerHeight) {
                const out = [];
                for (const ln of lines) {
                    if (ln.length > 6) {
                        // 优先按标点拆分
                        const parts = [];
                        let cur = '';
                        for (const ch of ln) {
                            cur += ch;
                            if ('，。！？、；：'.indexOf(ch) >= 0) { parts.push(cur); cur = ''; }
                        }
                        if (cur) parts.push(cur);
                        if (parts.length > 1 && parts.length <= 3) {
                            for (const pt of parts) out.push(pt);
                        } else {
                            const half = Math.ceil(ln.length / 2);
                            out.push(ln.slice(0, half), ln.slice(half));
                        }
                    } else {
                        out.push(ln);
                    }
                }
                lines = out;
            }

            const CW = 1024;
            const c = document.createElement('canvas');
            const g = c.getContext('2d');

            const latin = lines.every(function (l) { return /^[\x20-\x7E]+$/.test(l); });
            const family = latin
                ? '"Arial Black","Arial",sans-serif'
                : '"Microsoft YaHei","PingFang SC",sans-serif';
            const fontOf = function (fs) { return 'bold ' + fs + 'px ' + family; };

            // ① 先测量文字实际尺寸
            c.width = CW; c.height = 120;
            g.fillStyle = '#fff';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            const fsMax = latin ? 210 : 250;          // 字号上限提高 → 字更大
            g.font = fontOf(fsMax);
            let maxW = 0;
            lines.forEach(function (ln) { maxW = Math.max(maxW, g.measureText(ln).width); });
            const fs = Math.min(fsMax, fsMax * (CW * 0.92) / maxW);
            const lineH = fs * 1.16;
            const blockH = lines.length * lineH;
            // ② 按文字实际高度设定画布（紧凑无多余空白 → 世界尺寸不被虚高撑大）
            const CH = Math.max(90, Math.ceil(blockH * 1.16));

            c.width = CW; c.height = CH;
            g.fillStyle = '#fff';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.font = fontOf(fs);
            const startY = CH / 2 - ((lines.length - 1) * lineH) / 2;
            lines.forEach(function (ln, i) { g.fillText(ln, CW / 2, startY + i * lineH); });

            const img = g.getImageData(0, 0, CW, CH).data;

            const vFov = camera.fov * Math.PI / 180;
            const visH = 2 * Math.tan(vFov / 2) * HB_CAM_DIST;
            const visW = visH * camera.aspect;
            const textW = Math.min(9.0, visW * 0.96);
            const textH = textW * (CH / CW);

            // 自适应采样：让屏幕上相邻粒子的间距尽量小 → 笔画由密集小点勾勒，锐利清晰
            const screenW = window.innerWidth || 1280;
            const textPx = screenW * 0.98;
            const targetSpacingPx = screenW > 900 ? 3 : 2.5;   // 更密（原来 5px 太疏）
            const gap = Math.max(2, Math.min(10, Math.round(CW * targetSpacingPx / textPx)));
            const spacing = textW * gap / CW;
            const baseSize = spacing * 1.8;    // 点相互重叠 → 笔画实心化 + 加色叠加更亮
            const targets = [];
            for (let y = 0; y < CH; y += gap) {
                for (let x = 0; x < CW; x += gap) {
                    if (img[(y * CW + x) * 4 + 3] > 128) {
                        targets.push({
                            tx: (x / CW - 0.5) * textW,
                            ty: (0.5 - y / CH) * textH,
                            tz: (Math.random() - 0.5) * 0.3,
                        });
                    }
                }
            }

            // 暴露文字元数据 → 供前端生成"完全对齐"的清晰文本（无缝替换）
            let maxChars = 0;
            lines.forEach(function (l) { maxChars = Math.max(maxChars, l.length); });
            window.__BURST_META__ = {
                lines: lines.slice(),
                textW: textW,
                textH: textH,
                maxChars: maxChars,
                visH: visH,
                cyOffset: HB_CY,
                fs: fs,
                CW: CW,
                CH: CH,
                lineCount: lines.length,
            };
            const N = targets.length;
            const pos = new Float32Array(N * 3);
            const col = new Float32Array(N * 3);
            const vel = new Float32Array(N * 3);
            for (let i = 0; i < N; i++) {
                pos[i * 3] = 0; pos[i * 3 + 1] = 0; pos[i * 3 + 2] = 0;
                // 高亮配色（亮粉 / 亮金 / 亮紫 / 纯白）→ 加色混合后非常亮
                const r = Math.random();
                const PICK = r < 0.34
                    ? [1.0, 0.84, 0.92]      // 亮粉
                    : (r < 0.62
                        ? [1.0, 0.95, 0.72]  // 亮金
                        : (r < 0.82
                            ? [0.90, 0.84, 1.0]   // 亮紫
                            : [1.0, 1.0, 1.0]));  // 纯白
                col[i * 3] = PICK[0]; col[i * 3 + 1] = PICK[1]; col[i * 3 + 2] = PICK[2];
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const tex = makeGlowTex();
            const mat = new THREE.PointsMaterial({
                size: baseSize,
                map: tex,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 1,
                depthWrite: false,
                depthTest: false,
                sizeAttenuation: true,
            });
            mat.toneMapped = false;      // 不走色调映射 → 亮度不被压缩，字更实
            const points = new THREE.Points(geo, mat);
            points.frustumCulled = false;
            points.visible = false;
            points.renderOrder = 999;      // 永远最后渲染 → 不会被蛋糕粒子遮挡

            const flashMat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                depthWrite: false,
                opacity: 0,
            });
            points.add(new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), flashMat));

            scene.add(points);
            __hb = { points, geo, mat, pos, vel, targets, N, baseSize, flashMat };
        }

        function attachHappyToCamera() {
            if (!__hb) return;
            const h = __hb;
            const off = new THREE.Vector3(0, HB_CY, -HB_CAM_DIST);
            off.applyQuaternion(camera.quaternion);
            h.points.position.copy(camera.position).add(off);
            h.points.quaternion.copy(camera.quaternion);
        }

        window.__PARTICLE_BURST__ = function (lines, opts) {
            opts = opts || {};
            buildBurstFor(Array.isArray(lines) ? lines : [String(lines)]);
            __hbHold = opts.hold || 6.5;
            __hbKeep = !!opts.keep;         // keep=true → 永久保留，不淡出
            __hbMode = opts.mode || 'burst';
            const h = __hb;

            if (__hbMode === 'fade') {
                // 淡入模式：粒子直接在目标位置，柔和浮现（不做爆炸）
                for (let i = 0; i < h.N; i++) {
                    h.pos[i * 3] = h.targets[i].tx;
                    h.pos[i * 3 + 1] = h.targets[i].ty;
                    h.pos[i * 3 + 2] = h.targets[i].tz;
                }
                h.geo.attributes.position.needsUpdate = true;
                h.mat.opacity = 0;
                h.mat.size = h.baseSize;
                h.flashMat.opacity = 0;
                h.points.visible = true;
                attachHappyToCamera();
                __hbPhase = 2.5;
                __hbT0 = (performance.now() - animStartTime) / 1000;
                if (bloomPass) bloomPass.strength = 0.42;
                return;
            }

            for (let i = 0; i < h.N; i++) {
                h.pos[i * 3] = 0;
                h.pos[i * 3 + 1] = 0;
                h.pos[i * 3 + 2] = 0;
                const th = Math.acos(2 * Math.random() - 1);
                const ph = Math.random() * Math.PI * 2;
                const sp = 0.12 + Math.random() * 0.34;
                h.vel[i * 3] = Math.sin(th) * Math.cos(ph) * sp;
                h.vel[i * 3 + 1] = Math.cos(th) * sp;
                h.vel[i * 3 + 2] = Math.sin(th) * Math.sin(ph) * sp;
            }
            h.geo.attributes.position.needsUpdate = true;
            h.mat.opacity = 1;
            h.mat.size = h.baseSize * 1.75;
            h.flashMat.opacity = 1;
            h.points.visible = true;
            attachHappyToCamera();
            __hbPhase = 1;
            __hbT0 = (performance.now() - animStartTime) / 1000;
            // 文字展示时让蛋糕保持全亮（文字靠自身高对比度清晰）
            if (bloomPass) bloomPass.strength = 0.42;
        };

        // 手动让粒子文字退场（叠加层在替换为清晰文本时调用）
        window.__HIDE_BURST__ = function () {
            if (!__hb || __hbPhase === 0) return;
            __hbPhase = 4;
        };

        function updateHappyBurst(tSec) {
            if (!__hb || __hbPhase === 0) return;
            const h = __hb;
            const el = tSec - __hbT0;
            const pos = h.pos;

            if (__hbPhase === 1) {
                for (let i = 0; i < h.N; i++) {
                    pos[i * 3] += h.vel[i * 3];
                    pos[i * 3 + 1] += h.vel[i * 3 + 1];
                    pos[i * 3 + 2] += h.vel[i * 3 + 2];
                    h.vel[i * 3] *= 0.975;
                    h.vel[i * 3 + 1] *= 0.975;
                    h.vel[i * 3 + 2] *= 0.975;
                }
                h.flashMat.opacity = Math.max(0, 1 - el / 0.45);
                if (el > 0.55) {
                    __hbPhase = 2;
                    h.mat.size = h.baseSize;
                }
            } else if (__hbPhase === 2) {
                let settled = true;
                for (let i = 0; i < h.N; i++) {
                    const t = h.targets[i];
                    const dx = t.tx - pos[i * 3];
                    const dy = t.ty - pos[i * 3 + 1];
                    const dz = t.tz - pos[i * 3 + 2];
                    pos[i * 3] += dx * 0.085;
                    pos[i * 3 + 1] += dy * 0.085;
                    pos[i * 3 + 2] += dz * 0.085;
                    if (Math.abs(dx) > 0.03 || Math.abs(dy) > 0.03) settled = false;
                }
                if (settled || el > 2.6) __hbPhase = 3;
            } else if (__hbPhase === 2.5) {
                // 淡入（约 0.9s）
                h.mat.opacity = Math.min(1, el / 0.9);
                if (el > 0.9) {
                    h.mat.opacity = 1;
                    __hbPhase = 3;
                }
            } else if (__hbPhase === 3) {
                h.mat.opacity = 1;
                // keep 模式下永久停留（不进入淡出）
                if (!__hbKeep && el > __hbHold) __hbPhase = 4;
            } else if (__hbPhase === 4) {
                h.mat.opacity -= 0.02;
                if (h.mat.opacity <= 0) {
                    h.mat.opacity = 0;
                    h.points.visible = false;
                    __hbPhase = 0;
                    disposeHappy();
                    if (bloomPass) bloomPass.strength = 0.7;                   // 泛光恢复
                }
            }

            attachHappyToCamera();
            h.geo.attributes.position.needsUpdate = true;
        }

        function renderLoop(timestamp) {
            requestAnimationFrame(renderLoop);

            if (!animationStarted) {
                animateBackground();
                effectComposer.render();
                return;
            }

            const currentTimeSec = (timestamp - animStartTime) / 1000;

            // 聚合过程中的电影运镜（完成后停止，交由用户自由旋转/缩放）
            if (animPhase !== ANIM_PHASE.DONE) {
                updateCinematicCamera(currentTimeSec);
            }

            if (animPhase === ANIM_PHASE.PRE) {
                const preProgress = Math.min(currentTimeSec / SCAN_START_DELAY, 1.0);
                const easeIn = 1 - Math.pow(1 - preProgress, 3);

                ambientLight.intensity = 0.08 + (0.5 - 0.08) * easeIn;
                backLight.intensity = 0.15 + (0.5 - 0.15) * easeIn;
                fillLight.intensity = 0.1 + (0.35 - 0.1) * easeIn;
                topHighlight.intensity = 0.05 + (0.25 - 0.05) * easeIn;

                if (preProgress > 0.4) {
                    const ringFadeIn = (preProgress - 0.4) / 0.6;
                    scanRingMain.visible = true;
                    scanRingSecondary.visible = true;
                    scanRingMainMat.opacity = 0.85 * ringFadeIn;
                    scanRingSecondaryMat.opacity = 0.55 * ringFadeIn;
                    scanRingMain.position.y = SCAN_Y_START;
                    scanRingSecondary.position.y = SCAN_Y_START - 0.06;
                }

                if (particleSystem) particleSystem.rotation.y += 0.0015;

                if (currentTimeSec >= SCAN_START_DELAY) {
                    animPhase = ANIM_PHASE.SCANNING;
                    scanRingMain.position.y = SCAN_Y_START;
                    scanRingSecondary.position.y = SCAN_Y_START - 0.06;
                    scanRingMain.visible = true;
                    scanRingSecondary.visible = true;
                    scanRingMainMat.opacity = 0.85;
                    scanRingSecondaryMat.opacity = 0.55;
                    lastActivatedSortedIndex = -1;
                    batchActivateParticles(SCAN_Y_START);
                }
            } else if (animPhase === ANIM_PHASE.SCANNING) {
                const scanElapsed = currentTimeSec - SCAN_START_DELAY;
                scanProgress = Math.min(scanElapsed / SCAN_DURATION, 1.0);

                const scanY = SCAN_Y_START + scanProgress * (SCAN_Y_END - SCAN_Y_START);
                scanRingMain.position.y = scanY;
                scanRingSecondary.position.y = scanY - 0.07 - scanProgress * 0.04;

                const mainRadius = getScanRingRadius(scanY);
                const secondaryRadius = mainRadius * 1.06;
                scanRingMain.scale.set(mainRadius, mainRadius, mainRadius);
                scanRingSecondary.scale.set(secondaryRadius, secondaryRadius, secondaryRadius);

                batchActivateParticles(scanY);
                updateParticlePositions(currentTimeSec);

                if (particleSystem) particleSystem.rotation.y += 0.0012;

                if (scanProgress >= 1.0) {
                    animPhase = ANIM_PHASE.SETTLING;
                    scanRingFadeOutStart = true;
                    scanRingFadeOutTime = currentTimeSec;
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        if (!particleActivated[i]) {
                            particleActivated[i] = true;
                            particleActivationTime[i] = currentTimeSec;
                        }
                    }
                }
            } else if (animPhase === ANIM_PHASE.SETTLING) {
                const fadeElapsed = currentTimeSec - scanRingFadeOutTime;
                const fadeProgress = Math.min(fadeElapsed / SCAN_FADE_DURATION, 1.0);

                if (scanRingFadeOutStart) {
                    scanRingMainMat.opacity = 0.85 * (1 - fadeProgress);
                    scanRingSecondaryMat.opacity = 0.55 * (1 - fadeProgress);
                    const expandScale = 1 + fadeProgress * 2.5;
                    const baseMR = getScanRingRadius(SCAN_Y_END);
                    const baseSR = baseMR * 1.06;
                    scanRingMain.scale.set(baseMR * expandScale, baseMR * expandScale, baseMR * expandScale);
                    scanRingSecondary.scale.set(baseSR * expandScale, baseSR * expandScale, baseSR * expandScale);
                    scanRingMain.position.y = SCAN_Y_END + fadeProgress * 0.3;
                    scanRingSecondary.position.y = SCAN_Y_END + fadeProgress * 0.25;
                }

                updateParticlePositions(currentTimeSec);
                if (particleSystem) particleSystem.rotation.y *= 0.995;

                if (allParticlesSettled(currentTimeSec) && fadeProgress >= 0.75) {
                    animPhase = ANIM_PHASE.DONE;
                    scanRingMain.visible = false;
                    scanRingSecondary.visible = false;
                    scene.remove(scanRingMain);
                    scene.remove(scanRingSecondary);
                    scanRingMain = null;
                    scanRingSecondary = null;
                    controls.autoRotate = true;
                    bloomPass.strength = 0.7;
                    console.log("星辰");
                }
            } else if (animPhase === ANIM_PHASE.DONE) {
                updateParticlePositions(currentTimeSec);

                // 蛋糕成型后：周围粒子渐变为微弱点缀，突出蛋糕主体
                if (__settleK < 1) {
                    __settleK = Math.min(__settleK + 0.006, 1);
                    const k = 1 - __settleK * 0.76;              // 最终保留约 24%
                    ringMat.size = __RING_BASE_SIZE * k;
                    ringMat.opacity = k;
                    starMat.opacity = __STAR_BASE_OPACITY * (1 - __settleK * 0.42);
                }
            }

            if (animPhase !== ANIM_PHASE.PRE) {
                backLight.intensity = 0.5 + Math.sin(bgTime * 0.8) * 0.15;
                topHighlight.intensity = 0.25 + Math.sin(bgTime * 1.1) * 0.1;
            }

            controls.update();
            updateHappyBurst(currentTimeSec);
            animateBackground();
            effectComposer.render();
        }

        requestAnimationFrame(renderLoop);

        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log("星辰制作");
    </script>
